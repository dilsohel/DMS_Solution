<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DMS Solution</title>
    <script type="text/javascript">
      // Safe SPA fallback: redirect to the app root of this domain/subpath
      var path = window.location.pathname;
      var parts = path.split('/').filter(Boolean);
      // If hosted in a repository subpath like /repo-name/..., keep first segment
      var target = parts.length > 0 ? '/' + parts[0] + '/' : '/';
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Loading DMS Solution...</p>
  </body>
</html>
