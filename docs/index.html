<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMS Solution — Complete Business Management SaaS</title>
    <link rel="icon" type="image/jpeg" href="https://i.imgur.com/XjO7IJK.jpg" />
    <meta name="description" content="Multi-tenant Business Management SaaS Platform for shopkeepers, wholesalers, retailers, and manufacturers to manage sales, purchases, inventory, accounting, and reports." />
    <meta property="og:title" content="DMS Solution — Complete Business Management SaaS" />
    <meta property="og:description" content="Multi-tenant Business Management SaaS Platform for shopkeepers, wholesalers, retailers, and manufacturers to manage sales, purchases, inventory, accounting, and reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Trailing slash redirect for GitHub Pages repository URLs to ensure relative asset resolution -->
    <script>
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.includes('.') && window.location.hostname.endsWith('github.io')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <noscript>
      <div style="padding: 24px; background: #991b1b; color: #ffffff; text-align: center; font-family: system-ui, sans-serif;">
        <strong>JavaScript is required:</strong> Please enable JavaScript in your browser to access DMS Solution.
      </div>
    </noscript>

    <div id="root">
      <!-- Visible startup placeholder preventing blank white screen if assets or modules take time to load -->
      <div id="dms-boot-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; text-align: center;">
        <div style="max-width: 440px; width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
          <div style="width: 52px; height: 52px; margin: 0 auto 16px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
            <svg style="width: 28px; height: 28px; fill: none; stroke: #10b981; stroke-width: 2;" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <h2 style="margin: 0 0 6px; font-size: 20px; font-weight: 700; color: #ffffff;">DMS Solution</h2>
          <p id="boot-status-text" style="margin: 0 0 20px; font-size: 13px; color: #94a3b8; line-height: 1.5;">
            Loading business management workspace...
          </p>
          <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="window.location.reload()" style="background: #059669; color: white; border: none; padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">
              Reload
            </button>
          </div>
          <div id="boot-error-details" style="display: none; margin-top: 16px; padding: 12px; background: #090d16; border-radius: 8px; border: 1px solid #dc2626; color: #fca5a5; font-size: 12px; text-align: left; word-break: break-all; font-family: monospace;"></div>
        </div>
      </div>
    </div>

    <script>
      // Early error hook with capture-phase to capture script failures
      window.addEventListener('error', function(e) {
        var msg = e.message || (e.target && e.target.src ? 'Failed to fetch ' + e.target.src : '');
        // Ignore uncompiled tsx 404 if GitHub Pages fallback loader is running
        if (msg.indexOf('main.tsx') !== -1 && window.location.hostname.endsWith('github.io')) return;
        var errBox = document.getElementById('boot-error-details');
        var status = document.getElementById('boot-status-text');
        if (errBox && msg) {
          errBox.style.display = 'block';
          errBox.innerText = 'Script Load Error: ' + msg;
        }
        if (status && msg) {
          status.innerText = 'The application encountered an error while loading.';
          status.style.color = '#f87171';
        }
      }, true);
    </script>

    <!-- Dynamic loader for static GitHub Pages root deployment -->
    <script>
      (function() {
        if (window.location.hostname.endsWith('github.io')) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          document.head.appendChild(s);

          var c = document.createElement('link');
          c.rel = 'stylesheet';
          c.crossOrigin = 'anonymous';
          c.href = './assets/index.css';
          document.head.appendChild(c);
        }
      })();
    </script>

    <!-- Dev entry point for Vite dev server -->
  </body>
</html>
