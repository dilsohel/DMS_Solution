      function handleFirestoreError(error, operationType, path) {

        console.error('Firestore Error:', JSON.stringify(errInfo));

      function sanitizeForFirestore(obj) {
        if (obj === null || typeof obj !== 'object') return obj;
        if (Array.isArray(obj)) {
          return obj.map((item) =>
            item !== null && typeof item === 'object' && !(item instanceof Date)
              ? sanitizeForFirestore(item)
              : item
          );
        }
        const clean = {};
        for (const [key, val] of Object.entries(obj)) {
          if (val !== undefined) {
            if (Array.isArray(val)) {
              clean[key] = sanitizeForFirestore(val);
            } else if (val !== null && typeof val === 'object' && !(val instanceof Date)) {
              clean[key] = sanitizeForFirestore(val);
            } else {
              clean[key] = val;
            }
          }
        }
        return clean;
      }

      function compressImageToDataUrl(file, maxDim = 360, maxChars = 180000) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Failed to read image file'));
          reader.onload = () => {
            const rawDataUrl = String(reader.result || '');
            const img = new Image();
            img.onload = () => {
              try {
                let w = img.naturalWidth || img.width || maxDim;
                let h = img.naturalHeight || img.height || maxDim;
                if (w > maxDim || h > maxDim) {
                  if (w >= h) {
                    h = Math.max(1, Math.round((h * maxDim) / w));
                    w = maxDim;
                  } else {
                    w = Math.max(1, Math.round((w * maxDim) / h));
                    h = maxDim;
                  }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                let out = canvas.toDataURL('image/png');
                if (out.length > maxChars) out = canvas.toDataURL('image/webp', 0.85);
                if (out.length > maxChars) out = canvas.toDataURL('image/jpeg', 0.82);
                if (out.length > maxChars) out = canvas.toDataURL('image/jpeg', 0.65);
                resolve(out);
              } catch {
                resolve(rawDataUrl);
              }
            };
            img.onerror = () => resolve(rawDataUrl);
            img.src = rawDataUrl;
          };
          reader.readAsDataURL(file);
        });
      }

      async function uploadFileToStorage(file, path) {
        const compressedPromise = compressImageToDataUrl(file);
        try {
          const storageRef = ref(storage, path);
          const cloudUrl = await Promise.race([
            uploadBytes(storageRef, file).then((snap) => getDownloadURL(snap.ref)),
            new Promise((_, reject) => setTimeout(() => reject(new Error('Storage timeout')), 3500)),
          ]);
          if (cloudUrl) return cloudUrl;
        } catch {}
        return await compressedPromise;
      }

      function getShopInitials(name) {
        const parts = String(name || 'Shop').trim().split(/\s+/).filter(Boolean);
        if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
        return (parts[0] || 'S').slice(0, 2).toUpperCase();
      }

      function renderShopLogoHtml(biz, sizeClass = 'w-9 h-9', textClass = 'text-xs') {
        const name = biz?.name || 'Shop';
        const initials = esc(getShopInitials(name));
        const logoUrl = String(biz?.logoUrl || '').trim();
        if (!logoUrl) {
          return `<div class="${sizeClass} rounded-xl bg-gradient-to-br from-sky-600 to-emerald-600 text-white font-extrabold ${textClass} flex items-center justify-center shrink-0 shadow-xs border border-sky-300/60" title="${esc(name)}">${initials}</div>`;
        }
        return `<img src="${esc(logoUrl)}" alt="${esc(name)}" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" class="${sizeClass} rounded-xl object-contain bg-white border border-sky-200 p-0.5 shrink-0" /><div style="display:none" class="${sizeClass} rounded-xl bg-gradient-to-br from-sky-600 to-emerald-600 text-white font-extrabold ${textClass} items-center justify-center shrink-0 shadow-xs border border-sky-300/60" title="${esc(name)}">${initials}</div>`;
      }

      function esc(val) {
        if (val === null || val === undefined) return '';
        return String(val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function fmtMoney(val, currency = '৳') {
        const num = Number(val || 0);
        return `${esc(currency)}${num.toLocaleString()}`;
      }

      function pdfSafeText(val) {
        if (val === null || val === undefined) return '';
        return String(val)
          .replace(/৳/g, 'BDT ')
          .replace(/₹/g, 'INR ')
          .replace(/[—–]/g, '-')
          .replace(/×/g, 'x')
          .replace(/•/g, '|')
          .replace(/[^\x20-\x7E\xA0-\xFF]/g, '');
      }

      function pdfCurrencyPrefix(biz) {
        const cur = String(biz?.currency || '৳').trim();
        if (cur === '৳') return 'BDT ';
        if (cur === '₹') return 'INR ';
        if (/^[\x20-\x7E£€¥]+$/.test(cur)) return cur;
        return (biz?.currencyCode ? String(biz.currencyCode) + ' ' : 'BDT ');
      }

      function fmtMoneyPdf(val, biz) {
        const num = Number(val || 0);
        const absStr = Math.abs(num).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        return `${num < 0 ? '-' : ''}${pdfCurrencyPrefix(biz)}${absStr}`;
      }

      async function ensurePdfLibs() {
        const loadScript = (src) =>
          new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = () => reject(new Error('Failed to load PDF library'));
            document.head.appendChild(s);
          });
        if (!window.jspdf?.jsPDF) {
          await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js');
        }
        const testDoc = new window.jspdf.jsPDF();
        if (typeof testDoc.autoTable !== 'function') {
          await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js');
        }
      }

      function createStyledPdfDoc({ title, subtitle = '', periodLabel = '', kpis = [], orientation = 'portrait' }) {
        const biz = state.currentBusiness || {};
        const doc = new window.jspdf.jsPDF({ orientation, unit: 'pt', format: 'a4' });
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const marginX = 36;
        const contentW = pageWidth - marginX * 2;

        // Top dual-tone accent bar
        doc.setFillColor(2, 132, 199);
        doc.rect(0, 0, pageWidth * 0.65, 6, 'F');
        doc.setFillColor(5, 150, 105);
        doc.rect(pageWidth * 0.65, 0, pageWidth * 0.35, 6, 'F');

        // Shop Logo or Initials Monogram
        const logoUrl = String(biz.logoUrl || '').trim();
        let logoRendered = false;
        if (logoUrl.startsWith('data:image/')) {
          try {
            const fmt = logoUrl.includes('image/png') ? 'PNG' : 'JPEG';
            doc.addImage(logoUrl, fmt, marginX, 22, 36, 36);
            logoRendered = true;
          } catch {}
        }
        if (!logoRendered) {
          doc.setFillColor(2, 132, 199);
          doc.roundedRect(marginX, 22, 36, 36, 6, 6, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(13);
          doc.text(getShopInitials(biz.name || 'Shop'), marginX + 18, 44, { align: 'center' });
        }

        // Business info on left
        const textX = marginX + 46;
        doc.setTextColor(15, 23, 42);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(14);
        doc.text(pdfSafeText(biz.name || 'Business Workspace'), textX, 35);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8.5);
        doc.setTextColor(71, 85, 105);
        const contactParts = [biz.address, biz.phone, biz.email].filter(Boolean).map(pdfSafeText);
        if (contactParts.length > 0) {
          doc.text(contactParts.join('  |  '), textX, 48, { maxWidth: contentW * 0.52 });
        }
        if (biz.financialYear) {
          doc.text(`Financial Year: ${pdfSafeText(biz.financialYear)}`, textX, 59);
        }

        // Report Title & Metadata on right
        doc.setTextColor(2, 132, 199);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(13);
        doc.text(pdfSafeText(title).toUpperCase(), pageWidth - marginX, 34, { align: 'right' });

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8.5);
        doc.setTextColor(71, 85, 105);
        if (subtitle) {
          doc.text(pdfSafeText(subtitle), pageWidth - marginX, 46, { align: 'right' });
        }
        const genStr = new Date().toISOString().replace('T', ' ').slice(0, 16);
        const metaLine = [periodLabel ? `Period: ${pdfSafeText(periodLabel)}` : '', `Generated: ${genStr}`].filter(Boolean).join('  |  ');
        doc.text(metaLine, pageWidth - marginX, 58, { align: 'right' });

        // Divider
        doc.setDrawColor(203, 213, 225);
        doc.setLineWidth(0.75);
        doc.line(marginX, 70, pageWidth - marginX, 70);

        let curY = 84;

        // Optional KPI Summary Cards
        if (Array.isArray(kpis) && kpis.length > 0) {
          const gap = 10;
          const cardW = (contentW - gap * (kpis.length - 1)) / kpis.length;
          const cardH = 44;
          kpis.forEach((k, idx) => {
            const x = marginX + idx * (cardW + gap);
            doc.setFillColor(248, 250, 252);
            doc.setDrawColor(226, 232, 240);
            doc.roundedRect(x, curY, cardW, cardH, 5, 5, 'FD');

            const accent = k.color || [2, 132, 199];
            doc.setFillColor(accent[0], accent[1], accent[2]);
            doc.rect(x, curY + 4, 3, cardH - 8, 'F');

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7.2);
            doc.setTextColor(100, 116, 139);
            doc.text(pdfSafeText(k.label).toUpperCase(), x + 10, curY + 15);

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(10.5);
            doc.setTextColor(accent[0], accent[1], accent[2]);
            doc.text(pdfSafeText(k.value), x + 10, curY + 32, { maxWidth: cardW - 14 });
          });
          curY += cardH + 16;
        }

        const addFooters = () => {
          const totalPages = doc.getNumberOfPages();
          for (let i = 1; i <= totalPages; i++) {
            doc.setPage(i);
            doc.setDrawColor(226, 232, 240);
            doc.setLineWidth(0.5);
            doc.line(marginX, pageHeight - 32, pageWidth - marginX, pageHeight - 32);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(100, 116, 139);
            doc.text(pdfSafeText(`${biz.name || 'DMS Solution'} | Confidential Financial Statement`), marginX, pageHeight - 19);
            doc.text(`Page ${i} of ${totalPages}`, pageWidth - marginX, pageHeight - 19, { align: 'right' });
          }
        };

        return { doc, startY: curY, pageWidth, pageHeight, marginX, contentW, addFooters };
      }

      function showToast(message, type = 'success', durationMs = 4000) {
        const container = document.getElementById('app-toasts');
        if (!container) return;
        const id = 'toast_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const styles =
          type === 'error'
            ? 'bg-white border-rose-300 text-rose-800 shadow-rose-100'
            : type === 'info'
            ? 'bg-white border-sky-300 text-sky-900 shadow-sky-100'
            : 'bg-white border-emerald-300 text-emerald-900 shadow-emerald-100';
        const dot =
          type === 'error'
            ? 'bg-rose-500'
            : type === 'info'
            ? 'bg-sky-500'
            : 'bg-emerald-500';
        const el = document.createElement('div');
        el.id = id;
        el.className = `pointer-events-auto border rounded-2xl px-4 py-3 shadow-xl flex items-start gap-3 text-xs font-semibold animate-fade-in ${styles}`;
        el.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${dot} mt-1 shrink-0"></span><div class="flex-1">${esc(message)}</div><button class="text-slate-400 hover:text-slate-700" onclick="this.parentElement.remove()">✕</button>`;
        container.appendChild(el);
        setTimeout(() => {
          const t = document.getElementById(id);
          if (t) t.remove();
        }, durationMs);
      }

      function askConfirm(title, message, confirmLabel = 'Confirm', danger = true) {
        return new Promise((resolve) => {
          const modalHost = document.getElementById('app-modals');
          const wrapper = document.createElement('div');
          wrapper.className = 'fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4';
          wrapper.innerHTML = `
            <div class="bg-white border border-slate-200 rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 animate-fade-in">
              <h3 class="text-base font-bold text-slate-900">${esc(title)}</h3>
              <p class="text-xs text-slate-600 leading-relaxed">${esc(message)}</p>
              <div class="flex justify-end gap-2 pt-2">
                <button id="cfm-cancel" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                <button id="cfm-ok" class="px-4 py-2 rounded-xl text-xs font-bold text-white ${danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-emerald-600 hover:bg-emerald-700'}">${esc(confirmLabel)}</button>
              </div>
            </div>
          `;
          modalHost.appendChild(wrapper);
          wrapper.querySelector('#cfm-cancel').onclick = () => {
            wrapper.remove();
            resolve(false);
          };
          wrapper.querySelector('#cfm-ok').onclick = () => {
            wrapper.remove();
            resolve(true);
          };
        });
      }

      function computeMetrics() {
        const today = new Date().toISOString().split('T')[0];
        const totalSales = state.sales.reduce((s, x) => s + (x.total || 0), 0);
        const todaySales = state.sales
          .filter((x) => (x.createdAt || '').startsWith(today))
          .reduce((s, x) => s + (x.total || 0), 0);
        const totalPurchases = state.purchases.reduce((s, x) => s + (x.total || 0), 0);
        const todayPurchases = state.purchases
          .filter((x) => (x.createdAt || '').startsWith(today))
          .reduce((s, x) => s + (x.total || 0), 0);
        const totalExpenses = state.expenses.reduce((s, x) => s + (x.amount || 0), 0);
        const totalReceivables = state.customers.reduce((s, c) => s + (c.currentDue || 0), 0);
        const totalPayables = state.suppliers.reduce((s, p) => s + (p.currentDue || 0), 0);
        const cashBalance = state.accounts.filter((a) => a.type === 'cash').reduce((s, a) => s + (a.balance || 0), 0);
        const bankBalance = state.accounts.filter((a) => a.type === 'bank').reduce((s, a) => s + (a.balance || 0), 0);
        const mfsBalance = state.accounts.filter((a) => a.type === 'mfs').reduce((s, a) => s + (a.balance || 0), 0);
        const inventoryValue = state.products.reduce((s, p) => s + (p.currentStock || 0) * (p.purchasePrice || 0), 0);
        const lowStockCount = state.products.filter((p) => (p.currentStock || 0) <= (p.minStockAlert || 0)).length;

        const salesReturnTotal = state.returns
          .filter((r) => r.type === 'SALE_RETURN')
          .reduce((s, r) => s + Number(r.totalAmount || r.totalRefund || 0), 0);
        const purchaseReturnTotal = state.returns
          .filter((r) => r.type === 'PURCHASE_RETURN')
          .reduce((s, r) => s + Number(r.totalAmount || r.totalRefund || 0), 0);

        const netSales = Math.max(0, totalSales - salesReturnTotal);
        const netPurchases = Math.max(0, totalPurchases - purchaseReturnTotal);

        let totalCOGS = 0;
        state.sales.forEach((sale) => {
          (sale.items || []).forEach((it) => {
            totalCOGS += Number(it.purchasePrice || 0) * Number(it.quantity || 0);
          });
        });
        let returnedCOGS = 0;
        state.returns
          .filter((r) => r.type === 'SALE_RETURN')
          .forEach((ret) => {
            if (typeof ret.cogsAmount === 'number') {
              returnedCOGS += ret.cogsAmount;
            } else {
              (ret.items || []).forEach((it) => {
                returnedCOGS += Number(it.purchasePrice || 0) * Number(it.quantity || 0);
              });
            }
          });
        const netCOGS = Math.max(0, totalCOGS - returnedCOGS);

        const otherIncomeTotal = state.cashbook
          .filter((e) => e.entryType === 'OTHER_INCOME')
          .reduce((s, e) => s + Number(e.amount || 0), 0);
        const ownerCapitalTotal = state.cashbook
          .filter((e) => e.entryType === 'CAPITAL_IN')
          .reduce((s, e) => s + Number(e.amount || 0), 0);
        const ownerDrawingsTotal = state.cashbook
          .filter((e) => e.entryType === 'DRAWING_OUT')
          .reduce((s, e) => s + Number(e.amount || 0), 0);
        const loanInTotal = state.cashbook
          .filter((e) => e.entryType === 'LOAN_IN')
          .reduce((s, e) => s + Number(e.amount || 0), 0);
        const loanRepayTotal = state.cashbook
          .filter((e) => e.entryType === 'LOAN_REPAY')
          .reduce((s, e) => s + Number(e.amount || 0), 0);
        const loansPayable = Math.max(0, loanInTotal - loanRepayTotal);

        const grossProfit = netSales - netCOGS;
        const netProfit = grossProfit + otherIncomeTotal - totalExpenses;

        return {
          totalSales,
          todaySales,
          salesReturnTotal,
          netSales,
          totalPurchases,
          todayPurchases,
          purchaseReturnTotal,
          netPurchases,
          totalExpenses,
          otherIncomeTotal,
          ownerCapitalTotal,
          ownerDrawingsTotal,
          loansPayable,
          totalReceivables,
          totalPayables,
          cashBalance,
          bankBalance,
          mfsBalance,
          totalProducts: state.products.length,
          inventoryValue,
          lowStockCount,
          totalCOGS: netCOGS,
          grossProfit,
          netProfit,
        };
      }

      function formatAuthError(err) {
        const code = err?.code || '';
        if (code === 'auth/unauthorized-domain') {
          return `Domain "${window.location.hostname}" is not authorized in Firebase Console → Authentication → Settings → Authorized domains.`;
        }
        if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
          return 'Invalid email or password. Please check your credentials and try again.';
        }
        if (code === 'auth/email-already-in-use') {
          return 'An account with this email already exists. Please switch to "Sign In" instead.';
        }
        if (code === 'auth/weak-password') {
          return 'Password must be at least 6 characters long.';
        }
        if (code === 'auth/operation-not-allowed') {
          return 'Email/Password sign-up is not yet turned ON in Firebase Console. Enable Email/Password in Firebase Authentication → Sign-in method, or use Continue with Google.';
        }
        if (code === 'auth/popup-blocked') {
          return 'Popup was blocked by your browser. Please allow popups or try again.';
        }
        if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
          return 'Sign-in popup was closed before completing authentication.';
        }
        if (code === 'auth/network-request-failed') {
          return 'Network error. Please check your internet connection.';
        }
        return err?.message || 'Authentication error occurred.';
      }

      async function syncUserProfile(user, extra = {}) {
        if (!user) return null;
        const opts = typeof extra === 'string' ? { displayName: extra } : (extra || {});
        const path = `users/${user.uid}`;
        try {
          const userRef = doc(db, 'users', user.uid);
          const snap = await getDoc(userRef);
          const existing = snap.exists() ? snap.data() : {};
          const profile = sanitizeForFirestore({
            id: user.uid,
            uid: user.uid,
            email: user.email || existing.email || '',
            displayName: opts.displayName || user.displayName || existing.displayName || (user.email ? user.email.split('@')[0] : 'Business User'),
            phone: opts.phone || existing.phone || '',
            address: opts.address || existing.address || '',
            businessName: opts.businessName || existing.businessName || '',
            businessId: opts.businessId || existing.businessId || '',
            photoURL: user.photoURL || existing.photoURL || '',
            memberBusinessIds: Array.isArray(existing.memberBusinessIds) ? existing.memberBusinessIds : [],
            updatedAt: new Date().toISOString(),
            createdAt: existing.createdAt || new Date().toISOString(),
          });
          await setDoc(userRef, profile, { merge: true });
          return { ...existing, ...profile };
        } catch (err) {
          handleFirestoreError(err, 'write', path);
          return null;
        }
      }

      function getBillingStatus() {
        const now = new Date();
        const year = now.getFullYear();
        const monthNum = now.getMonth() + 1;
        const month = String(monthNum).padStart(2, '0');
        const monthKey = `${year}-${month}`;
        const day = now.getDate();
        const monthLabel = now.toLocaleString('en-US', { month: 'long', year: 'numeric' });

        const approvedRecord = state.userProfile?.approvedMonths?.[monthKey] || null;
        const monthReqs = (state.userRequests || [])
          .filter((r) => r.month === monthKey)
          .sort((a, b) => String(b.submittedAt || '').localeCompare(String(a.submittedAt || '')));
        const latestRequest = monthReqs[0] || null;

        const isPaid = Boolean(approvedRecord) || latestRequest?.status === 'APPROVED';
        const isPending = !isPaid && latestRequest?.status === 'PENDING';
        const isRejected = !isPaid && latestRequest?.status === 'REJECTED';

        const beforeGlobalStart =
          year < BILLING_CONFIG.startYear ||
          (year === BILLING_CONFIG.startYear &&
            (monthNum < BILLING_CONFIG.startMonth ||
              (monthNum === BILLING_CONFIG.startMonth && day < BILLING_CONFIG.noticeStartDay)));

        const createdRaw = state.userProfile?.createdAt || state.user?.metadata?.creationTime || '';
        const createdDate = createdRaw ? new Date(createdRaw) : null;
        const joinedAfterThisMonthCutoff = Boolean(
          createdDate &&
            !isNaN(createdDate.getTime()) &&
            createdDate.getFullYear() === year &&
            createdDate.getMonth() + 1 === monthNum &&
            createdDate.getDate() > BILLING_CONFIG.noticeEndDay
        );

        const billingActive = !beforeGlobalStart && !joinedAfterThisMonthCutoff;
        const isNoticeWindow =
          billingActive && !isPaid && day >= BILLING_CONFIG.noticeStartDay && day <= BILLING_CONFIG.noticeEndDay;
        const isUrgent = billingActive && !isPaid && (day === 9 || day === 10);
        const isLocked = billingActive && !isPaid && day > BILLING_CONFIG.noticeEndDay;
        const dismissKey = isUrgent ? `urgent_${monthKey}` : monthKey;
        const isDismissed = state.billingNoticeDismissedMonth === dismissKey;
        const daysLeft = Math.max(0, BILLING_CONFIG.noticeEndDay - day);
        return {
          monthKey,
          monthLabel,
          day,
          daysLeft,
          beforeGlobalStart,
          billingActive,
          isPaid,
          isPending,
          isRejected,
          latestRequest,
          approvedRecord,
          isNoticeWindow,
          isUrgent,
          isLocked,
          dismissKey,
          isDismissed,
        };
      }

      function maybeTriggerUrgentBillingAlert() {
        if (!state.user || isSuperAdminUser() || state.authLoading) return;
        const b = getBillingStatus();
        if (!b.isUrgent || b.isPending) return;
        const alertKey = `${b.monthKey}-${b.day}-${state.user.uid}`;
        if (state.urgentNotifiedKey === alertKey) return;
        state.urgentNotifiedKey = alertKey;
        sessionStorage.setItem('dms_urgent_notified_key', alertKey);
        const deadlineText = b.day === 10 ? 'আজ ১০ তারিখ — পেমেন্টের শেষ দিন!' : 'আগামীকাল ১০ তারিখ — পেমেন্টের শেষ সময়!';
        showToast(`URGENT: ${b.monthLabel} মাসের ৳${BILLING_CONFIG.monthlyFee} পেমেন্ট বাকি (${deadlineText})`, 'error');
        try {
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            new Notification('URGENT: DMS Solution Monthly Payment Due', {
              body: `${b.monthLabel} - ৳${BILLING_CONFIG.monthlyFee} due (${deadlineText})`,
            });
          }
        } catch {}
      }

      function getLowStockProducts() {
        return state.products
          .filter((p) => Number(p.currentStock || 0) <= Number(p.minStockAlert ?? 0))
          .slice()
          .sort((a, b) => {
            const sa = Number(a.currentStock || 0);
            const sb = Number(b.currentStock || 0);
            if ((sa <= 0) !== (sb <= 0)) return sa <= 0 ? -1 : 1;
            const ga = sa - Number(a.minStockAlert ?? 0);
            const gb = sb - Number(b.minStockAlert ?? 0);
            if (ga !== gb) return ga - gb;
            return (a.name || '').localeCompare(b.name || '');
          });
      }

      function triggerLowStockDesktopAlert(items, isTransition = false) {
        if (!items || items.length === 0) return;
        const preview = items
          .slice(0, 3)
          .map((p) => `${p.name} (${Number(p.currentStock || 0)}/${Number(p.minStockAlert ?? 0)} ${p.unit || 'pcs'})`)
          .join(', ');
        const extra = items.length > 3 ? ` +${items.length - 3} more` : '';
        const prefix = isTransition ? 'URGENT LOW STOCK ALERT' : 'Low Stock Alert';
        showToast(`${prefix}: ${preview}${extra}`, 'error', 7500);

        try {
          if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
            const bizName = state.currentBusiness?.name || 'DMS Solution';
            const n = new Notification(`⚠️ ${prefix} — ${bizName}`, {
              body: `${items.length} product(s) at or below Min Alert: ${preview}${extra}. Click to view & restock.`,
              icon: state.currentBusiness?.logoUrl || LOGO_URL,

      async function requestDesktopNotificationPermission() {
        if (typeof Notification === 'undefined') {
          state.desktopNotifyPerm = 'unsupported';
          showToast('Desktop notifications are not supported in this browser.', 'info');
          render();
          return;
        }
        try {
          const perm = await Notification.requestPermission();
          state.desktopNotifyPerm = perm;
          if (perm === 'granted') {
            showToast('Desktop low-stock alerts enabled! You will get real-time popups when stock drops.');
            const lowItems = getLowStockProducts();
            const bizName = state.currentBusiness?.name || 'DMS Solution';
            const n = new Notification(`Desktop Alerts Active — ${bizName}`, {
              body: lowItems.length > 0
                ? `${lowItems.length} product(s) currently below Min Alert. Click to view & restock.`
                : 'You will be notified immediately whenever a product falls below its Min Alert.',
              icon: state.currentBusiness?.logoUrl || LOGO_URL,
              tag: 'dms-low-stock-setup',
            });
            n.onclick = () => {
              try { window.focus(); } catch {}
              if (lowItems.length > 0) {
                state.currentView = 'products';
                state.productsStockFilter = 'LOW';
                render();
              }
              try { n.close(); } catch {}
            };
          } else if (perm === 'denied') {
            showToast('Browser notifications are blocked. Enable Notifications for this site in your browser settings.', 'error', 7000);
          }
        } catch (err) {
          showToast('Could not enable desktop notifications: ' + (err?.message || 'Permission error'), 'error');
        }
        render();
      }

      function generatePaymentQrCode(method = 'bkash', options = {}) {
        const isNagad = String(method || '').toLowerCase() === 'nagad';
        const number = options.number || (isNagad ? BILLING_CONFIG.nagad : BILLING_CONFIG.bkash);
        const size = Number(options.size || 104);
        const color = options.color || (isNagad ? '#c2410c' : '#be185d');
        const payload = String(options.payload || number);

        try {
          if (typeof window.qrcode === 'function') {
            const qr = window.qrcode(0, 'M');
            qr.addData(payload);
            qr.make();
            const count = qr.getModuleCount();
            const pad = 2;
            const total = count + pad * 2;
            let rects = '';
            for (let r = 0; r < count; r++) {
              for (let c = 0; c < count; c++) {
                if (qr.isDark(r, c)) {
                  rects += `<rect x="${c + pad}" y="${r + pad}" width="1" height="1" fill="${color}" />`;
                }
              }
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${size}" height="${size}" shape-rendering="crispEdges" class="rounded-lg bg-white border border-slate-200 block" role="img" aria-label="${esc(isNagad ? 'Nagad' : 'bKash')} payment QR code for ${esc(number)}"><rect width="${total}" height="${total}" fill="#ffffff"/>${rects}</svg>`;
          }
        } catch (err) {
          console.warn('Local QR generation fallback:', err?.message || err);
        }

        return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(payload)}" alt="${esc(isNagad ? 'Nagad' : 'bKash')} QR" width="${size}" height="${size}" class="rounded-lg bg-white border border-slate-200 block" referrerpolicy="no-referrer" />`;
      }

          const svgEl = modal.querySelector('svg');
          if (!svgEl) return showToast('Right-click QR image to save.', 'info');
          const blob = new Blob([svgEl.outerHTML], { type: 'image/svg+xml' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `dms-${label.toLowerCase()}-qr-${number}.svg`;
          a.click();
          showToast(`${label} QR ডাউনলোড হয়েছে!`);
        };

      function validateSubscriptionInputs(method, senderPhone, trxId) {
        const phone = String(senderPhone || '').replace(/[\s-]/g, '').trim();
        const trx = String(trxId || '').replace(/\s+/g, '').trim().toUpperCase();
        if (!/^01[3-9]\d{8}$/.test(phone)) {
          throw new Error('সঠিক ১১ ডিজিটের মোবাইল নাম্বার দিন (যেমন: 017XXXXXXXX)।');
        }
        if (!/^[A-Z0-9]{6,20}$/.test(trx) || !/[0-9]/.test(trx)) {
          throw new Error('সঠিক Transaction ID (TrxID) দিন (কমপক্ষে ৬ অক্ষরের সঠিক ট্রানজেকশন কোড)।');
        }
        if (/^([A-Z0-9])\1+$/.test(trx) || ['123456', '1234567', '12345678', '123456789', '0123456', '654321'].includes(trx)) {
          throw new Error('ভুল বা অনুমাননির্ভর Transaction ID গ্রহণযোগ্য নয়। অনুগ্রহ করে সঠিক TrxID দিন।');
        }
        if (trx === BILLING_CONFIG.bkash || trx === BILLING_CONFIG.nagad || phone === BILLING_CONFIG.bkash || phone === BILLING_CONFIG.nagad) {
          throw new Error('আমাদের রিসিভার নাম্বার নয়, আপনার নিজের সেন্ডার নাম্বার ও আসল Transaction ID দিন।');
        }
        const usedReqs = (state.userRequests || []).filter((r) => r.status !== 'REJECTED');
        if (usedReqs.some((r) => String(r.trxId || '').toUpperCase() === trx)) {
          throw new Error('এই Transaction ID ইতিমধ্যে জমা দেয়া হয়েছে। নতুন পেমেন্টের TrxID দিন।');
        }
        return { method, senderPhone: phone, trxId: trx };
      }

        const clean = validateSubscriptionInputs(method, senderPhone, trxId);

        const requestDoc = sanitizeForFirestore({
          id: reqId,
          userId: state.user.uid,
          userEmail: state.user.email || state.userProfile?.email || '',
          userName: state.userProfile?.displayName || state.user.displayName || 'Business User',

          businessName: state.currentBusiness?.name || state.userProfile?.businessName || 'Not created yet',
          month: status.monthKey,
          monthLabel: status.monthLabel,
          amount: BILLING_CONFIG.monthlyFee,
          method: clean.method,
          receiverNumber: clean.method === 'nagad' ? BILLING_CONFIG.nagad : BILLING_CONFIG.bkash,
          senderPhone: clean.senderPhone,
          trxId: clean.trxId,
          status: 'PENDING',
          rejectionReason: '',
          submittedAt: now,
        });

        await setDoc(doc(db, 'subscriptionRequests', reqId), requestDoc);

        try {
          await setDoc(
            doc(db, 'users', state.user.uid),
            sanitizeForFirestore({
              phone: state.userProfile?.phone || clean.senderPhone,
              lastSubmittedPayment: {
                requestId: reqId,
                month: status.monthKey,
                trxId: clean.trxId,
                method: clean.method,
                status: 'PENDING',
                submittedAt: now,
              },
              updatedAt: now,
            }),

          );
        } catch (err) {
          console.warn('Profile payment note skipped:', err.message);
        }

        state.userRequests = [requestDoc, ...(state.userRequests || []).filter((r) => r.id !== reqId)];

        if (state.currentBusiness && state.currentBusiness.ownerId === state.user.uid) {
          await logAuditAction(
            'BILLING',
            'SUBMIT_SUBSCRIPTION',
            `Submitted ${status.monthLabel} fee ৳${BILLING_CONFIG.monthlyFee} via ${clean.method.toUpperCase()} (TrxID: ${clean.trxId}) - Pending Admin Approval`,
            reqId

        }

        showToast('আপনার পেমেন্ট ও Transaction ID জমা হয়েছে! অ্যাডমিন অ্যাপ্রুভ করলেই সাথে সাথে সাইট আনলক হবে।', 'info');
        render();
        return requestDoc;
      }

      function subscribeBusinessData(bizId) {
        cleanupBusinessSubs();
        if (!bizId) return;
        const cols = [
          ['products', 'products', 'name', 'asc'],
          ['customers', 'customers', 'name', 'asc'],
          ['suppliers', 'suppliers', 'name', 'asc'],
          ['supplierPayments', 'supplierPayments', 'createdAt', 'desc'],
          ['sales', 'sales', 'createdAt', 'desc'],
          ['purchases', 'purchases', 'createdAt', 'desc'],
          ['accounts', 'accounts', 'name', 'asc'],
          ['expenses', 'expenses', 'date', 'desc'],
          ['stockMovements', 'stockMovements', 'createdAt', 'desc'],
          ['returns', 'returns', 'createdAt', 'desc'],
          ['cashbook', 'cashbook', 'createdAt', 'desc'],
          ['members', 'members', 'joinedAt', 'desc'],
          ['auditLogs', 'auditLogs', 'timestamp', 'desc'],
        ];

        cols.forEach(([colName, stateKey, orderField, dir]) => {
          const colRef = collection(db, 'businesses', bizId, colName);
          const q = query(colRef, orderBy(orderField, dir));
          const unsub = onSnapshot(
            q,
            (snap) => {
              state[stateKey] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              if (colName === 'products') {
                const lowItems = getLowStockProducts();
                const aboveIds = new Set(
                  state.products
                    .filter((p) => Number(p.currentStock || 0) > Number(p.minStockAlert ?? 0))
                    .map((p) => p.id)
                );
                const nextStocks = {};
                state.products.forEach((p) => {
                  nextStocks[p.id] = Number(p.currentStock || 0);
                });
                const canAlert = state.user && !isSuperAdminUser() && !getBillingStatus().isLocked;

                if (state.lowStockInitializedBiz !== bizId) {
                  state.lowStockInitializedBiz = bizId;
                  state.lowStockPrevAboveIds = aboveIds;
                  state.lowStockPrevStocks = nextStocks;
                  if (canAlert && lowItems.length > 0) {
                    triggerLowStockDesktopAlert(lowItems, false);
                  }
                } else {
                  const newlyLow = lowItems.filter((p) => {
                    const wasAbove = state.lowStockPrevAboveIds.has(p.id);
                    const prevQty = state.lowStockPrevStocks[p.id];
                    const droppedFurther = prevQty !== undefined && Number(p.currentStock || 0) < prevQty;
                    return wasAbove || droppedFurther;
                  });
                  state.lowStockPrevAboveIds = aboveIds;
                  state.lowStockPrevStocks = nextStocks;
                  if (canAlert && newlyLow.length > 0) {
                    state.lowStockDismissedSig = '';
                    triggerLowStockDesktopAlert(newlyLow, true);
                  }
                }
              }
              if (colName === 'members' && state.user && state.currentBusiness) {
                if (state.currentBusiness.ownerId === state.user.uid) {
                  state.currentRole = 'owner';
                } else {
                  const me = state.members.find((m) => m.uid === state.user.uid || m.id === state.user.uid);
                  state.currentRole = me?.role || 'salesperson';
                }
              }
              if (colName === 'accounts' && state.accounts.length > 0) {
                if (!state.salesAccountId || !state.accounts.some((a) => a.id === state.salesAccountId)) {
                  const def = state.accounts.find((a) => a.type === 'cash') || state.accounts[0];
                  state.salesAccountId = def?.id || '';
                }
                if (!state.purchasesAccountId || !state.accounts.some((a) => a.id === state.purchasesAccountId)) {
                  const def = state.accounts.find((a) => a.type === 'cash') || state.accounts[0];
                  state.purchasesAccountId = def?.id || '';
                }
              }
              scheduleRender();
            },
            (err) => {
              console.warn(`Listener error [${colName}]:`, err.message);
            }
          );
          state.unsubs.push(unsub);
        });
      }

      async function fetchBusinessesForUser(user, profile) {
        if (!user) return;
        try {
          const qOwned = query(collection(db, 'businesses'), where('ownerId', '==', user.uid));
          const ownedSnap = await getDocs(qOwned);
          const bizMap = new Map();
          ownedSnap.docs.forEach((d) => bizMap.set(d.id, { id: d.id, ...d.data() }));

          const memberIds = profile?.memberBusinessIds || [];
          for (const bId of memberIds) {
            if (!bizMap.has(bId)) {
              try {
                const bDoc = await getDoc(doc(db, 'businesses', bId));
                if (bDoc.exists()) bizMap.set(bDoc.id, { id: bDoc.id, ...bDoc.data() });
              } catch {}
            }
          }

          state.businesses = Array.from(bizMap.values());
          const savedId = localStorage.getItem(`dms_active_biz_${user.uid}`);
          const selected = state.businesses.find((b) => b.id === savedId) || state.businesses[0] || null;
          selectBusiness(selected);
        } catch (err) {
          console.error('fetchBusinessesForUser error:', err);
          showToast('Failed to load your workspaces: ' + (err.message || 'Check permissions'), 'error');
        }
      }

      async function signInWithGoogle() {
        state.authLoadingSubmit = true;
        state.authError = null;
        state.authErrorCode = '';
        render();
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await signInWithPopup(auth, provider);
        } catch (err) {
          const code = err?.code || '';
          const isTopLevel = (() => { try { return window.self === window.top; } catch { return false; } })();
          if (isTopLevel && (code === 'auth/popup-blocked' || code === 'auth/cancelled-popup-request')) {
            try {
              await signInWithRedirect(auth, provider);
              return;
            } catch (rErr) {
              state.authErrorCode = rErr?.code || '';
              state.authError = formatAuthError(rErr);
            }
          } else {
            state.authErrorCode = code;
            state.authError = formatAuthError(err);
          }
          state.authLoadingSubmit = false;
          render();
        }
      }

      async function recordCapitalOrIncomeTransaction({ entryType, amount, date, accountId, partyName = '', notes = '' }) {

        const amt = Number(amount || 0);
        if (!(amt > 0)) throw new Error('Amount must be greater than zero');
        const isIn = ['CAPITAL_IN', 'OTHER_INCOME', 'LOAN_IN'].includes(entryType);
        const direction = isIn ? 'IN' : 'OUT';
        await runTransaction(db, async (tx) => {
          const aRef = accountId ? doc(db, 'businesses', bizId, 'accounts', accountId) : null;
          const aSnap = aRef ? await tx.get(aRef) : null;
          const now = new Date().toISOString();
          let accName = '';
          if (aRef && aSnap && aSnap.exists()) {
            accName = aSnap.data().name || '';
            const cur = Number(aSnap.data().balance || 0);
            if (!isIn && cur < amt) {
              throw new Error(`Insufficient balance in ${accName}`);
            }
            tx.update(aRef, { balance: isIn ? cur + amt : cur - amt, updatedAt: now });
          }
          recordCashbookEntryTx(tx, bizId, {
            entryType,
            direction,
            amount: amt,
            accountId: accountId || '',
            accountName: accName,
            partyName: partyName || (isIn ? 'Owner / Source' : 'Owner / Lender'),
            referenceId: entryType,
            notes: notes || entryType.replace(/_/g, ' '),
            date: date || now.slice(0, 10),
            now,
          });
          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: 'ACCOUNTS',
              action: entryType,
              details: `${entryType.replace(/_/g, ' ')}: ${state.currentBusiness.currency}${amt}${partyName ? ' (' + partyName + ')' : ''}`,
              timestamp: now,
            })
          );
        });
        showToast('Bookkeeping entry recorded!');
      }

      async function createSale(payload) {
        const bizId = state.currentBusiness.id;
        let savedSale = null;

        await runTransaction(db, async (tx) => {
          const bizRef = doc(db, 'businesses', bizId);
          const bizSnap = await tx.get(bizRef);
          if (!bizSnap.exists()) throw new Error('Business not found');
          const bizData = bizSnap.data();

          const productSnaps = [];
          for (const item of payload.items) {
            const pRef = doc(db, 'businesses', bizId, 'products', item.productId);
            const pSnap = await tx.get(pRef);
            if (!pSnap.exists()) throw new Error(`Product "${item.productName}" not found`);
            productSnaps.push({ ref: pRef, snap: pSnap, item });
          }

          let custRef = null;
          let custSnap = null;
          if (payload.customerId) {
            custRef = doc(db, 'businesses', bizId, 'customers', payload.customerId);
            custSnap = await tx.get(custRef);
          }

          let accRef = null;
          let accSnap = null;
          if (payload.accountId && payload.paidAmount > 0) {
            accRef = doc(db, 'businesses', bizId, 'accounts', payload.accountId);
            accSnap = await tx.get(accRef);
          }

          for (const { snap, item } of productSnaps) {
            const avail = Number(snap.data().currentStock || 0);
            if (avail < item.quantity) {
              throw new Error(`Insufficient stock for "${snap.data().name}". Available: ${avail}`);
            }
          }

          const nextNo = Number(bizData.nextInvoiceNumber || 1001);
          const prefix = bizData.invoicePrefix || 'DMS-';
          const invoiceNumber = `${prefix}${nextNo}`;
          const now = new Date().toISOString();
          const saleId = 'sale_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

          const dueAmount = Math.max(0, Number(payload.total) - Number(payload.paidAmount));
          const status = dueAmount <= 0 ? 'PAID' : Number(payload.paidAmount) > 0 ? 'PARTIAL' : 'DUE';

          savedSale = sanitizeForFirestore({
            id: saleId,
            invoiceNumber,
            customerId: payload.customerId || '',
            customerName: payload.customerName || 'Walk-in Customer',
            customerPhone: payload.customerPhone || '',
            items: payload.items,
            subtotal: Number(payload.subtotal),
            discount: Number(payload.discount || 0),
            tax: Number(payload.tax || 0),
            total: Number(payload.total),
            paidAmount: Number(payload.paidAmount),
            dueAmount,
            paymentMethod: payload.paymentMethod || 'cash',
            accountId: payload.accountId || '',
            status,
            notes: payload.notes || '',
            createdBy: state.user.uid,
            createdByName: state.user.displayName || state.user.email || 'Staff',
            createdAt: now,
          });

          tx.update(bizRef, { nextInvoiceNumber: nextNo + 1, updatedAt: now });
          tx.set(doc(db, 'businesses', bizId, 'sales', saleId), savedSale);

          for (const { ref: pRef, snap, item } of productSnaps) {
            const prevStock = Number(snap.data().currentStock || 0);
            const newStock = prevStock - Number(item.quantity);
            tx.update(pRef, { currentStock: newStock, updatedAt: now });
            const movId = 'mov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            tx.set(
              doc(db, 'businesses', bizId, 'stockMovements', movId),
              sanitizeForFirestore({
                productId: item.productId,
                productName: item.productName,
                type: 'OUT',
                quantity: Number(item.quantity),
                previousStock: prevStock,
                newStock,
                referenceType: 'SALE',
                referenceId: invoiceNumber,
                notes: `Sold via ${invoiceNumber}`,
                createdBy: state.user.uid,
                createdAt: now,
              })
            );
          }

          if (custRef && custSnap && custSnap.exists()) {
            const c = custSnap.data();
            tx.update(custRef, {
              totalPurchases: Number(c.totalPurchases || 0) + Number(payload.total),
              totalPaid: Number(c.totalPaid || 0) + Number(payload.paidAmount),
              currentDue: Number(c.currentDue || 0) + dueAmount,
              updatedAt: now,
            });
          }

          if (accRef && accSnap && accSnap.exists()) {
            tx.update(accRef, {
              balance: Number(accSnap.data().balance || 0) + Number(payload.paidAmount),
              updatedAt: now,
            });
            if (Number(payload.paidAmount) > 0) {
              recordCashbookEntryTx(tx, bizId, {
                entryType: 'SALE',
                direction: 'IN',
                amount: Number(payload.paidAmount),
                accountId: accSnap.id,
                accountName: accSnap.data().name || '',
                partyName: savedSale.customerName,
                referenceId: invoiceNumber,
                notes: `Cash received on invoice ${invoiceNumber}`,
                now,
              });
            }
          }

          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: 'SALES',
              action: 'CREATE_SALE',
              details: `Invoice ${invoiceNumber} for ${savedSale.customerName} (${state.currentBusiness.currency}${savedSale.total})`,
              targetId: saleId,
              timestamp: now,
            })
          );
        });

        return savedSale;
      }

      async function adjustProductStock(productId, delta, reason) {
        const bizId = state.currentBusiness.id;
        await runTransaction(db, async (tx) => {
          const pRef = doc(db, 'businesses', bizId, 'products', productId);
          const pSnap = await tx.get(pRef);
          if (!pSnap.exists()) throw new Error('Product not found');
          const p = pSnap.data();
          const prev = Number(p.currentStock || 0);
          const next = Math.max(0, prev + Number(delta));
          const now = new Date().toISOString();
          tx.update(pRef, { currentStock: next, updatedAt: now });
          const movId = 'mov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'stockMovements', movId),
            sanitizeForFirestore({
              productId,
              productName: p.name,
              type: delta >= 0 ? 'IN' : 'OUT',
              quantity: Math.abs(Number(delta)),
              previousStock: prev,
              newStock: next,
              referenceType: 'ADJUSTMENT',
              referenceId: 'ADJ',
              notes: reason || 'Manual stock adjustment',
              createdBy: state.user.uid,
              createdAt: now,
            })
          );
        });
        await logAuditAction('INVENTORY', 'ADJUST_STOCK', `Adjusted stock by ${delta > 0 ? '+' : ''}${delta} (${reason})`, productId);
        showToast('Stock level adjusted!');
      }

      async function paySupplier(supplierId, amount, accountId, notes = '', options = {}) {
        const bizId = state.currentBusiness.id;
        const paid = Number(amount || 0);
        if (!(paid > 0)) throw new Error('Payment amount must be greater than zero');
        let savedPayment = null;

        await runTransaction(db, async (tx) => {
          const sRef = doc(db, 'businesses', bizId, 'suppliers', supplierId);
          const sSnap = await tx.get(sRef);
          if (!sSnap.exists()) throw new Error('Supplier not found');

          const aRef = accountId ? doc(db, 'businesses', bizId, 'accounts', accountId) : null;
          const aSnap = aRef ? await tx.get(aRef) : null;

          const purchaseId = options?.purchaseId || '';
          const purRef = purchaseId ? doc(db, 'businesses', bizId, 'purchases', purchaseId) : null;
          const purSnap = purRef ? await tx.get(purRef) : null;

          const now = new Date().toISOString();
          const s = sSnap.data();
          const paymentDate = (options?.date || now.slice(0, 10)).slice(0, 10);
          const paymentId = 'spay_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          const paymentNumber = 'SPAY-' + String(Date.now()).slice(-6);
          const accData = aSnap && aSnap.exists() ? aSnap.data() : null;
          const billNumber = purSnap && purSnap.exists() ? (purSnap.data().billNumber || options?.billNumber || '') : (options?.billNumber || '');

          savedPayment = sanitizeForFirestore({
            id: paymentId,
            paymentNumber,
            supplierId,
            supplierName: s.name || 'Supplier',
            amount: paid,
            accountId: accData ? aSnap.id : (accountId || ''),
            accountName: accData ? (accData.name || '') : '',
            paymentMethod: accData ? (accData.type || 'cash') : 'cash',
            purchaseId: purSnap && purSnap.exists() ? purchaseId : '',
            billNumber,
            date: paymentDate,
            notes: notes || '',
            createdBy: state.user.uid,
            createdByName: state.user.displayName || state.user.email || 'User',
            createdAt: now,
          });

          tx.set(doc(db, 'businesses', bizId, 'supplierPayments', paymentId), savedPayment);

          tx.update(sRef, {
            currentDue: Math.max(0, Number(s.currentDue || 0) - paid),
            totalPaid: Number(s.totalPaid || 0) + paid,
            updatedAt: now,
          });

          if (purRef && purSnap && purSnap.exists()) {
            const pd = purSnap.data();
            const newPaid = Number(pd.paidAmount || 0) + paid;
            const newDue = Math.max(0, Number(pd.dueAmount ?? (Number(pd.total || 0) - Number(pd.paidAmount || 0))) - paid);
            const newStatus = newDue <= 0 ? 'PAID' : newPaid > 0 ? 'PARTIAL' : 'DUE';
            tx.update(purRef, {
              paidAmount: newPaid,
              dueAmount: newDue,
              status: newStatus,
              updatedAt: now,
            });
          }

          if (aRef && aSnap && aSnap.exists()) {
            tx.update(aRef, { balance: Number(aSnap.data().balance || 0) - paid, updatedAt: now });
          }

          recordCashbookEntryTx(tx, bizId, {
            entryType: 'SUPPLIER_PAYMENT',
            direction: 'OUT',
            amount: paid,
            accountId: accData ? aSnap.id : '',
            accountName: accData ? (accData.name || '') : '',
            partyName: s.name || 'Supplier',
            referenceId: billNumber || paymentNumber,
            notes: notes || (billNumber ? `Payment toward ${billNumber}` : `Payment ${paymentNumber} to ${s.name}`),
            date: paymentDate,
            now,
          });

          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: 'SUPPLIERS',
              action: 'PAY_SUPPLIER',
              details: `Paid ${state.currentBusiness.currency}${paid} to ${s.name}${billNumber ? ' for ' + billNumber : ''}${notes ? ' (' + notes + ')' : ''}`,
              targetId: supplierId,
              timestamp: now,
            })
          );
        });
        showToast('Supplier payment recorded & ledger updated!');
        return savedPayment;
      }

      async function transferFunds(fromId, toId, amount, notes = '') {
        if (fromId === toId) throw new Error('Source and destination accounts must be different');
        const bizId = state.currentBusiness.id;
        await runTransaction(db, async (tx) => {
          const fromRef = doc(db, 'businesses', bizId, 'accounts', fromId);
          const toRef = doc(db, 'businesses', bizId, 'accounts', toId);
          const [fromSnap, toSnap] = await Promise.all([tx.get(fromRef), tx.get(toRef)]);
          if (!fromSnap.exists() || !toSnap.exists()) throw new Error('Account not found');
          const amt = Number(amount);
          if (Number(fromSnap.data().balance || 0) < amt) {
            throw new Error(`Insufficient balance in ${fromSnap.data().name}`);
          }
          const now = new Date().toISOString();
          tx.update(fromRef, { balance: Number(fromSnap.data().balance || 0) - amt, updatedAt: now });
          tx.update(toRef, { balance: Number(toSnap.data().balance || 0) + amt, updatedAt: now });
          recordCashbookEntryTx(tx, bizId, {
            entryType: 'TRANSFER_OUT',
            direction: 'OUT',
            amount: amt,
            accountId: fromSnap.id,
            accountName: fromSnap.data().name || '',
            partyName: toSnap.data().name || 'Destination Account',
            referenceId: 'TRF',
            notes: notes || `Transfer to ${toSnap.data().name}`,
            now,
          });
          recordCashbookEntryTx(tx, bizId, {
            entryType: 'TRANSFER_IN',
            direction: 'IN',
            amount: amt,
            accountId: toSnap.id,
            accountName: toSnap.data().name || '',
            partyName: fromSnap.data().name || 'Source Account',
            referenceId: 'TRF',
            notes: notes || `Transfer from ${fromSnap.data().name}`,
            now,
          });
          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: 'ACCOUNTS',
              action: 'FUND_TRANSFER',
              details: `Transferred ${state.currentBusiness.currency}${amt} from ${fromSnap.data().name} to ${toSnap.data().name}${notes ? ' — ' + notes : ''}`,
              timestamp: now,
            })
          );
        });
        showToast('Funds transferred!');
      }

      async function createReturnRecord({ type, referenceId, partyId, partyName, items, totalRefund, dueAdjusted = null, cashRefund = null, accountId, reason }) {
        const bizId = state.currentBusiness.id;
        let savedReturn = null;
        await runTransaction(db, async (tx) => {
          const prodSnaps = [];
          for (const it of items) {
            const pRef = doc(db, 'businesses', bizId, 'products', it.productId);
            const pSnap = await tx.get(pRef);
            if (pSnap.exists()) prodSnaps.push({ ref: pRef, snap: pSnap, it });
          }
          let partyRef = null;
          let partySnap = null;
          if (partyId) {
            partyRef = doc(db, 'businesses', bizId, type === 'SALE_RETURN' ? 'customers' : 'suppliers', partyId);
            partySnap = await tx.get(partyRef);
          }
          const totalAmt = Number(totalRefund || 0);
          const dueAdj = dueAdjusted !== null && dueAdjusted !== undefined ? Math.min(totalAmt, Math.max(0, Number(dueAdjusted))) : 0;
          const cashRef = cashRefund !== null && cashRefund !== undefined ? Math.max(0, Number(cashRefund)) : Math.max(0, totalAmt - dueAdj);

          let accRef = null;
          let accSnap = null;
          if (accountId && cashRef > 0) {
            accRef = doc(db, 'businesses', bizId, 'accounts', accountId);
            accSnap = await tx.get(accRef);
          }

          let cogsAmount = 0;
          items.forEach((it) => {
            const prod = prodSnaps.find((x) => x.it.productId === it.productId);
            const cost = Number(it.purchasePrice ?? prod?.snap?.data()?.purchasePrice ?? it.unitCost ?? 0);
            cogsAmount += cost * Number(it.quantity || 0);
          });

          const now = new Date().toISOString();
          const retId = 'ret_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          const returnNumber = (type === 'SALE_RETURN' ? 'CRN-' : 'DBN-') + String(Date.now()).slice(-6);
          savedReturn = sanitizeForFirestore({
            id: retId,
            returnNumber,
            type,
            referenceId,
            partyId: partyId || '',
            partyName: partyName || '',
            items,
            totalAmount: totalAmt,
            dueAdjusted: dueAdj,
            cashRefund: cashRef,
            cogsAmount,
            accountId: accountId || '',
            reason: reason || 'Returned goods',
            createdBy: state.user.uid,
            createdAt: now,
          });
          tx.set(doc(db, 'businesses', bizId, 'returns', retId), savedReturn);

          for (const { ref: pRef, snap, it } of prodSnaps) {
            const prev = Number(snap.data().currentStock || 0);
            const next = type === 'SALE_RETURN' ? prev + Number(it.quantity) : Math.max(0, prev - Number(it.quantity));
            tx.update(pRef, { currentStock: next, updatedAt: now });
            const movId = 'mov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            tx.set(
              doc(db, 'businesses', bizId, 'stockMovements', movId),
              sanitizeForFirestore({
                productId: it.productId,
                productName: it.productName,
                type: type === 'SALE_RETURN' ? 'IN' : 'OUT',
                quantity: Number(it.quantity),
                previousStock: prev,
                newStock: next,
                referenceType: 'RETURN',
                referenceId: returnNumber,
                notes: `${type === 'SALE_RETURN' ? 'Sales Return' : 'Purchase Return'} (${referenceId})`,
                createdBy: state.user.uid,
                createdAt: now,
              })
            );
          }

          if (partyRef && partySnap && partySnap.exists() && dueAdj > 0) {
            const pd = partySnap.data();
            tx.update(partyRef, {
              currentDue: Math.max(0, Number(pd.currentDue || 0) - dueAdj),
              updatedAt: now,
            });
          }
          if (accRef && accSnap && accSnap.exists() && cashRef > 0) {
            const cur = Number(accSnap.data().balance || 0);
            tx.update(accRef, {
              balance: type === 'SALE_RETURN' ? cur - cashRef : cur + cashRef,
              updatedAt: now,
            });
            recordCashbookEntryTx(tx, bizId, {
              entryType: type,
              direction: type === 'SALE_RETURN' ? 'OUT' : 'IN',
              amount: cashRef,
              accountId: accSnap.id,
              accountName: accSnap.data().name || '',
              partyName: partyName || 'Party',
              referenceId: returnNumber,
              notes: `${type === 'SALE_RETURN' ? 'Refunded on' : 'Refund received on'} ${referenceId}`,
              now,
            });
          }
          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: type === 'SALE_RETURN' ? 'SALES' : 'PURCHASES',
              action: type,
              details: `${returnNumber} (${type}) on ${referenceId} (${state.currentBusiness.currency}${totalAmt})`,
              targetId: retId,
              timestamp: now,
            })
          );
        });
        showToast('Return processed & stock adjusted!');
        return savedReturn;
      }

      function renderDashboardCharts() {
        const barEl = document.getElementById('chart-sales-bar');
        const pieEl = document.getElementById('chart-expense-doughnut');
        if (!window.Chart) return;
        if (state.charts.salesBar) {
          state.charts.salesBar.destroy();
          state.charts.salesBar = null;
        }
        if (state.charts.expenseDoughnut) {
          state.charts.expenseDoughnut.destroy();
          state.charts.expenseDoughnut = null;
        }

        if (barEl) {
          const months = [];
          const now = new Date();
          for (let i = 5; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            months.push({
              key: d.toISOString().slice(0, 7),
              label: d.toLocaleString('en-US', { month: 'short' }),
              sales: 0,
              profit: 0,
            });
          }
          state.sales.forEach((s) => {
            const k = (s.createdAt || '').slice(0, 7);
            const m = months.find((x) => x.key === k);
            if (m) {
              m.sales += Number(s.total || 0);
              let cogs = 0;
              (s.items || []).forEach((it) => (cogs += (it.purchasePrice || 0) * (it.quantity || 0)));
              m.profit += Number(s.total || 0) - cogs;
            }
          });
          state.charts.salesBar = new window.Chart(barEl, {
            type: 'bar',
            data: {
              labels: months.map((m) => m.label),
              datasets: [
                { label: 'Sales', data: months.map((m) => m.sales), backgroundColor: '#0284c7', borderRadius: 6 },
                { label: 'Gross Profit', data: months.map((m) => m.profit), backgroundColor: '#10b981', borderRadius: 6 },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: '#334155', font: { size: 11, weight: 'bold' } } } },
              scales: {
                x: { ticks: { color: '#475569' }, grid: { display: false } },
                y: { ticks: { color: '#475569' }, grid: { color: '#e2e8f0' } },
              },
            },
          });
        }

        if (pieEl) {
          const byCat = {};
          state.expenses.forEach((e) => {
            const cat = e.category || 'Other';
            byCat[cat] = (byCat[cat] || 0) + Number(e.amount || 0);
          });
          const labels = Object.keys(byCat);
          const data = Object.values(byCat);
          state.charts.expenseDoughnut = new window.Chart(pieEl, {
            type: 'doughnut',
            data: {
              labels: labels.length ? labels : ['No Expenses'],
              datasets: [
                {
                  data: data.length ? data : [1],
                  backgroundColor: labels.length ? ['#0284c7', '#10b981', '#f59e0b', '#6366f1', '#ec4899', '#14b8a6'] : ['#e2e8f0'],
                  borderWidth: 2,
                  borderColor: '#ffffff',
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { color: '#334155', font: { size: 11 } } } },
            },
          });
        }
      }

      function getSupplierLedgerData(sup) {
        const purchases = state.purchases
          .filter((p) => p.supplierId === sup.id || (!p.supplierId && p.supplierName === sup.name))
          .slice()
          .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

        const directPayments = state.supplierPayments
          .filter((sp) => sp.supplierId === sup.id)
          .slice()
          .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

        const returns = state.returns
          .filter((r) => r.type === 'PURCHASE_RETURN' && (r.partyId === sup.id || (!r.partyId && r.partyName === sup.name)))
          .slice()
          .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

        // Build unified payment history (upfront payments on bills + subsequent supplierPayments + legacy cashbook fallback)
        const paymentEvents = [];
        directPayments.forEach((sp) => {
          paymentEvents.push({
            id: sp.id,
            ref: sp.paymentNumber || sp.id,
            source: 'SUPPLIER_PAYMENT',
            date: sp.date || (sp.createdAt || '').slice(0, 10),
            createdAt: sp.createdAt || (sp.date ? sp.date + 'T12:00:00Z' : ''),
            amount: Number(sp.amount || 0),
            accountName: sp.accountName || sp.paymentMethod || 'Cash/Bank',
            billNumber: sp.billNumber || '',
            purchaseId: sp.purchaseId || '',
            notes: sp.notes || (sp.billNumber ? `Bill settlement (${sp.billNumber})` : 'Account payment'),
            createdByName: sp.createdByName || '',
          });
        });

        purchases.forEach((p) => {
          const linkedSum = directPayments
            .filter((sp) => sp.purchaseId === p.id)
            .reduce((sum, sp) => sum + Number(sp.amount || 0), 0);
          const initialPaid =
            p.initialPaidAmount !== undefined && p.initialPaidAmount !== null
              ? Number(p.initialPaidAmount || 0)
              : Math.max(0, Number(p.paidAmount || 0) - linkedSum);
          if (initialPaid > 0) {
            const acc = state.accounts.find((a) => a.id === p.accountId);
            paymentEvents.push({
              id: 'init_' + p.id,
              ref: p.billNumber || p.id,
              source: 'PURCHASE_UPFRONT',
              date: (p.createdAt || '').slice(0, 10),
              createdAt: p.createdAt || '',
              amount: initialPaid,
              accountName: acc?.name || p.paymentMethod || 'Cash',
              billNumber: p.billNumber || '',
              purchaseId: p.id,
              notes: `Paid at purchase (${p.billNumber || 'Bill'})`,
              createdByName: p.createdByName || '',
            });
          }
        });

        // Legacy cashbook fallback (entries recorded before supplierPayments subcollection existed)
        state.cashbook
          .filter(
            (cb) =>
              cb.entryType === 'SUPPLIER_PAYMENT' &&
              (cb.referenceId === sup.id || cb.partyName === sup.name) &&
              !directPayments.some((sp) => sp.createdAt === cb.createdAt || sp.paymentNumber === cb.referenceId)
          )
          .forEach((cb) => {
            paymentEvents.push({
              id: cb.id,
              ref: cb.referenceId || cb.id,
              source: 'LEGACY_CASHBOOK',
              date: cb.date || (cb.createdAt || '').slice(0, 10),
              createdAt: cb.createdAt || '',
              amount: Number(cb.amount || 0),
              accountName: cb.accountName || 'Cash/Bank',
              billNumber: cb.referenceId && String(cb.referenceId).startsWith('PUR-') ? cb.referenceId : '',
              purchaseId: '',
              notes: cb.notes || 'Supplier payment',
              createdByName: cb.createdByName || '',
            });
          });

        paymentEvents.sort((a, b) => String(b.createdAt || b.date || '').localeCompare(String(a.createdAt || a.date || '')));

        // Build chronological statement events to calculate exact running balance due
        const timeline = [];
        const ob = Number(sup.openingBalance || 0);
        if (ob > 0) {
          timeline.push({
            id: 'ob_' + sup.id,
            kind: 'OPENING',
            ref: 'OPENING',
            date: (sup.createdAt || '').slice(0, 10) || '-',
            sortAt: sup.createdAt || '0000-01-01T00:00:00.000Z',
            description: 'Opening Balance Payable',
            subtext: sup.notes || 'Initial payable balance carried forward',
            billed: ob,
            paid: 0,
            returnedDue: 0,
            delta: ob,
          });
        }

        purchases.forEach((p) => {
          const itemPreview = (p.items || [])
            .slice(0, 2)
            .map((it) => `${it.productName} ×${it.quantity}`)
            .join(', ');
          const extra = (p.items || []).length > 2 ? ` +${p.items.length - 2} more` : '';
          timeline.push({
            id: 'bill_' + p.id,
            kind: 'PURCHASE',
            ref: p.billNumber || p.id,
            purchaseId: p.id,
            date: (p.createdAt || '').slice(0, 10),
            sortAt: p.createdAt || '',
            description: `Purchase Bill ${p.billNumber || ''}`,
            subtext: itemPreview + extra || 'Stock purchase',
            billed: Number(p.total || 0),
            paid: 0,
            returnedDue: 0,
            delta: Number(p.total || 0),
          });
        });

        paymentEvents.forEach((pm) => {
          // Ensure upfront payments sort immediately after their bill on same timestamp
          const sortAt = pm.source === 'PURCHASE_UPFRONT' ? (pm.createdAt || '') + '_1' : (pm.createdAt || pm.date || '') + '_2';
          timeline.push({
            id: 'pay_' + pm.id,
            kind: 'PAYMENT',
            ref: pm.ref,
            date: pm.date,
            sortAt,
            description: pm.source === 'PURCHASE_UPFRONT' ? `Paid with Bill ${pm.billNumber}` : `Payment ${pm.ref}`,
            subtext: `${pm.accountName}${pm.notes ? ' • ' + pm.notes : ''}`,
            billed: 0,
            paid: Number(pm.amount || 0),
            returnedDue: 0,
            delta: -Number(pm.amount || 0),
          });
        });

        returns.forEach((r) => {
          const adj = Number(r.dueAdjusted || 0);
          const cashRef = Number(r.cashRefund || 0);
          timeline.push({
            id: 'ret_' + r.id,
            kind: 'RETURN',
            ref: r.returnNumber || r.id,
            date: (r.createdAt || '').slice(0, 10),
            sortAt: (r.createdAt || '') + '_3',
            description: `Purchase Return ${r.returnNumber || ''}`,
            subtext: `${r.referenceId ? 'Ref: ' + r.referenceId + ' • ' : ''}Total: ${r.totalAmount || r.totalRefund || 0}${cashRef > 0 ? ' (Cash Refund: ' + cashRef + ')' : ''}`,
            billed: 0,
            paid: 0,
            returnedDue: adj,
            delta: -adj,
          });
        });

        timeline.sort((a, b) => String(a.sortAt).localeCompare(String(b.sortAt)));
        let running = 0;
        const statementRows = timeline.map((row) => {
          running = Math.max(0, running + row.delta);
          return { ...row, runningBalance: running };
        });

        const totalPurchased = purchases.reduce((s, p) => s + Number(p.total || 0), 0) + ob;
        const totalPaidAll = paymentEvents.reduce((s, p) => s + Number(p.amount || 0), 0);
        const totalReturnedDueAdj = returns.reduce((s, r) => s + Number(r.dueAdjusted || 0), 0);
        const totalReturnedAll = returns.reduce((s, r) => s + Number(r.totalAmount || r.totalRefund || 0), 0);
        const currentDue = Number(sup.currentDue ?? Math.max(0, totalPurchased - totalPaidAll - totalReturnedDueAdj));
        const lastActivity = statementRows.length > 0 ? statementRows[statementRows.length - 1].date : (sup.createdAt || '').slice(0, 10);

        return {
          purchases,
          payments: paymentEvents,
          returns,
          statementRows,
          summary: {
            openingBalance: ob,
            totalPurchased,
            totalPaidAll,
            totalReturnedDueAdj,
            totalReturnedAll,
            currentDue,
            billCount: purchases.length,
            paymentCount: paymentEvents.length,
            returnCount: returns.length,
            lastActivity,
          },
        };
      }

      function getFilteredReportData() {
        const tf = state.reportsTimeFilter || 'MONTH';
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        const monthStr = now.toISOString().slice(0, 7);
        const yearStr = String(now.getFullYear());
        const periodLabels = { TODAY: `Today (${todayStr})`, MONTH: `This Month (${monthStr})`, YEAR: `Year ${yearStr}`, ALL: 'All Time' };

        const inRange = (iso) => {
          if (!iso || tf === 'ALL') return true;
          if (tf === 'TODAY') return iso.startsWith(todayStr);
          if (tf === 'MONTH') return iso.startsWith(monthStr);
          if (tf === 'YEAR') return iso.startsWith(yearStr);
          return true;
        };

        const sales = state.sales.filter((s) => inRange(s.createdAt));
        const purchases = state.purchases.filter((p) => inRange(p.createdAt));
        const expenses = state.expenses.filter((e) => inRange(e.date || e.createdAt));
        const returns = state.returns.filter((r) => inRange(r.createdAt));
        const cashbook = state.cashbook.filter((e) => inRange(e.date || e.createdAt));

        const grossSales = sales.reduce((s, x) => s + Number(x.total || 0), 0);
        const saleReturnsAmt = returns.filter((r) => r.type === 'SALE_RETURN').reduce((s, r) => s + Number(r.totalAmount || r.totalRefund || 0), 0);
        const purchaseReturnsAmt = returns.filter((r) => r.type === 'PURCHASE_RETURN').reduce((s, r) => s + Number(r.totalAmount || r.totalRefund || 0), 0);
        const netSales = Math.max(0, grossSales - saleReturnsAmt);

        let grossCogs = 0;
        sales.forEach((s) => (s.items || []).forEach((it) => (grossCogs += Number(it.purchasePrice || 0) * Number(it.quantity || 0))));
        let retCogs = 0;
        returns.filter((r) => r.type === 'SALE_RETURN').forEach((r) => {
          if (typeof r.cogsAmount === 'number') retCogs += r.cogsAmount;
          else (r.items || []).forEach((it) => (retCogs += Number(it.purchasePrice || 0) * Number(it.quantity || 0)));
        });
        const netCogs = Math.max(0, grossCogs - retCogs);
        const grossProfit = netSales - netCogs;
        const otherIncome = cashbook.filter((e) => e.entryType === 'OTHER_INCOME').reduce((s, e) => s + Number(e.amount || 0), 0);
        const totalExpenses = expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
        const netProfit = grossProfit + otherIncome - totalExpenses;
        const grossMargin = netSales > 0 ? ((grossProfit / netSales) * 100).toFixed(1) : '0.0';
        const netMargin = netSales > 0 ? ((netProfit / netSales) * 100).toFixed(1) : '0.0';
        const m = computeMetrics();

        return {
          tf,
          periodLabel: periodLabels[tf] || 'All Time',
          sales,
          purchases,
          expenses,
          returns,
          cashbook,
          grossSales,
          saleReturnsAmt,
          purchaseReturnsAmt,
          netSales,
          netCogs,
          grossProfit,
          otherIncome,
          totalExpenses,
          netProfit,
          grossMargin,
          netMargin,
          m,
        };
      }
