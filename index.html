      function sanitizeForFirestore(obj) {
        if (obj === null || typeof obj !== 'object') return obj;
        if (Array.isArray(obj)) {
          return obj.map((item) =>
            item !== null && typeof item === 'object' && !(item instanceof Date)
              ? sanitizeForFirestore(item)
              : item
          );
        }
        const clean = {};
        for (const [key, val] of Object.entries(obj)) {
          if (val !== undefined) {
            if (Array.isArray(val)) {
              clean[key] = sanitizeForFirestore(val);
            } else if (val !== null && typeof val === 'object' && !(val instanceof Date)) {
              clean[key] = sanitizeForFirestore(val);
            } else {
              clean[key] = val;
            }
          }
        }
        return clean;
      }

      async function uploadFileToStorage(file, path) {
        try {
          const storageRef = ref(storage, path);
          const snapshot = await uploadBytes(storageRef, file);
          return await getDownloadURL(snapshot.ref);
        } catch (err) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }
      }

      function esc(val) {
        if (val === null || val === undefined) return '';
        return String(val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

        const container = document.getElementById('app-toasts');

        const dot =

            : type === 'info'

        const el = document.createElement('div');

        container.appendChild(el);
        setTimeout(() => {

          if (t) t.remove();

      function computeMetrics() {
        const today = new Date().toISOString().split('T')[0];
        const totalSales = state.sales.reduce((s, x) => s + (x.total || 0), 0);
        const todaySales = state.sales
          .filter((x) => (x.createdAt || '').startsWith(today))
          .reduce((s, x) => s + (x.total || 0), 0);
        const totalPurchases = state.purchases.reduce((s, x) => s + (x.total || 0), 0);
        const todayPurchases = state.purchases
          .filter((x) => (x.createdAt || '').startsWith(today))
          .reduce((s, x) => s + (x.total || 0), 0);
        const totalExpenses = state.expenses.reduce((s, x) => s + (x.amount || 0), 0);
        const totalReceivables = state.customers.reduce((s, c) => s + (c.currentDue || 0), 0);
        const totalPayables = state.suppliers.reduce((s, p) => s + (p.currentDue || 0), 0);
        const cashBalance = state.accounts.filter((a) => a.type === 'cash').reduce((s, a) => s + (a.balance || 0), 0);
        const bankBalance = state.accounts.filter((a) => a.type === 'bank').reduce((s, a) => s + (a.balance || 0), 0);
        const mfsBalance = state.accounts.filter((a) => a.type === 'mfs').reduce((s, a) => s + (a.balance || 0), 0);
        const inventoryValue = state.products.reduce((s, p) => s + (p.currentStock || 0) * (p.purchasePrice || 0), 0);
        const lowStockCount = state.products.filter((p) => (p.currentStock || 0) <= (p.minStockAlert || 0)).length;

        let totalCOGS = 0;
        state.sales.forEach((sale) => {
          (sale.items || []).forEach((it) => {
            totalCOGS += (it.purchasePrice || 0) * (it.quantity || 0);
          });
        });
        const grossProfit = totalSales - totalCOGS;
        const netProfit = grossProfit - totalExpenses;

        return {
          totalSales,
          todaySales,
          totalPurchases,
          todayPurchases,
          totalExpenses,
          totalReceivables,
          totalPayables,
          cashBalance,
          bankBalance,
          mfsBalance,
          totalProducts: state.products.length,
          inventoryValue,
          lowStockCount,
          grossProfit,
          netProfit,
        };
      }

      function formatAuthError(err) {
        const code = err?.code || '';
        if (code === 'auth/unauthorized-domain') {
          return `Domain "${window.location.hostname}" is not authorized in Firebase Console → Authentication → Settings → Authorized domains. Add it to sign in with Google.`;
        }
        if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
          return 'Invalid email or password. Please check your credentials and try again.';
        }
        if (code === 'auth/email-already-in-use') {
          return 'An account with this email already exists. Please sign in instead.';
        }
        if (code === 'auth/weak-password') {
          return 'Password must be at least 6 characters long.';
        }
        if (code === 'auth/operation-not-allowed') {
          return 'This sign-in method is not enabled in Firebase Authentication Console.';
        }
        if (code === 'auth/popup-closed-by-user') {
          return 'Sign-in popup was closed before completing authentication.';
        }
        if (code === 'auth/network-request-failed') {
          return 'Network error. Please check your internet connection.';
        }
        return err?.message || 'Authentication error occurred.';
      }

      async function syncUserProfile(user) {
        if (!user) return null;
        try {
          const userRef = doc(db, 'users', user.uid);
          const snap = await getDoc(userRef);
          const existing = snap.exists() ? snap.data() : {};
          const profile = sanitizeForFirestore({
            uid: user.uid,
            email: user.email || existing.email || '',
            displayName: user.displayName || existing.displayName || (user.email ? user.email.split('@')[0] : 'Business User'),
            photoURL: user.photoURL || existing.photoURL || '',
            memberBusinessIds: Array.isArray(existing.memberBusinessIds) ? existing.memberBusinessIds : [],
            updatedAt: new Date().toISOString(),
            createdAt: existing.createdAt || new Date().toISOString(),
          });
          await setDoc(userRef, profile, { merge: true });
          return profile;
        } catch (err) {
          console.error('syncUserProfile error:', err);
          return null;
        }
      }

      function subscribeBusinessData(bizId) {
        cleanupBusinessSubs();
        if (!bizId) return;
        const cols = [
          ['products', 'products', 'name', 'asc'],
          ['customers', 'customers', 'name', 'asc'],
          ['suppliers', 'suppliers', 'name', 'asc'],
          ['sales', 'sales', 'createdAt', 'desc'],
          ['purchases', 'purchases', 'createdAt', 'desc'],
          ['accounts', 'accounts', 'name', 'asc'],
          ['expenses', 'expenses', 'date', 'desc'],
          ['stockMovements', 'stockMovements', 'createdAt', 'desc'],
          ['returns', 'returns', 'createdAt', 'desc'],
          ['members', 'members', 'joinedAt', 'desc'],
          ['auditLogs', 'auditLogs', 'timestamp', 'desc'],
        ];

        cols.forEach(([colName, stateKey, orderField, dir]) => {
          const colRef = collection(db, 'businesses', bizId, colName);
          const q = query(colRef, orderBy(orderField, dir));
          const unsub = onSnapshot(
            q,
            (snap) => {
              state[stateKey] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              if (colName === 'members' && state.user && state.currentBusiness) {
                if (state.currentBusiness.ownerId === state.user.uid) {
                  state.currentRole = 'owner';
                } else {
                  const me = state.members.find((m) => m.uid === state.user.uid || m.id === state.user.uid);
                  state.currentRole = me?.role || 'salesperson';
                }
              }
              if (colName === 'accounts' && state.accounts.length > 0) {
                if (!state.salesAccountId || !state.accounts.some((a) => a.id === state.salesAccountId)) {
                  const def = state.accounts.find((a) => a.type === 'cash') || state.accounts[0];
                  state.salesAccountId = def?.id || '';
                }
                if (!state.purchasesAccountId || !state.accounts.some((a) => a.id === state.purchasesAccountId)) {
                  const def = state.accounts.find((a) => a.type === 'cash') || state.accounts[0];
                  state.purchasesAccountId = def?.id || '';
                }
              }
              scheduleRender();
            },
            (err) => {
              console.warn(`Listener error [${colName}]:`, err.message);
            }
          );
          state.unsubs.push(unsub);
        });
      }

      async function fetchBusinessesForUser(user, profile) {
        if (!user) return;
        try {
          const qOwned = query(collection(db, 'businesses'), where('ownerId', '==', user.uid));
          const ownedSnap = await getDocs(qOwned);
          const bizMap = new Map();
          ownedSnap.docs.forEach((d) => bizMap.set(d.id, { id: d.id, ...d.data() }));

          const memberIds = profile?.memberBusinessIds || [];
          for (const bId of memberIds) {
            if (!bizMap.has(bId)) {
              try {
                const bDoc = await getDoc(doc(db, 'businesses', bId));
                if (bDoc.exists()) bizMap.set(bDoc.id, { id: bDoc.id, ...bDoc.data() });
              } catch {}
            }
          }

          state.businesses = Array.from(bizMap.values());
          const savedId = localStorage.getItem(`dms_active_biz_${user.uid}`);
          const selected = state.businesses.find((b) => b.id === savedId) || state.businesses[0] || null;
          selectBusiness(selected);
        } catch (err) {
          console.error('fetchBusinessesForUser error:', err);
          showToast('Failed to load your workspaces: ' + (err.message || 'Check permissions'), 'error');
        }
      }

      function selectBusiness(biz) {
        state.currentBusiness = biz || null;
        resetBusinessData();
        if (biz && state.user) {
          localStorage.setItem(`dms_active_biz_${state.user.uid}`, biz.id);
          state.currentRole = biz.ownerId === state.user.uid ? 'owner' : 'salesperson';
          subscribeBusinessData(biz.id);
        } else {
          cleanupBusinessSubs();
        }
      }

            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: moduleName,
              action,
              details,
              targetId,
              timestamp: new Date().toISOString(),
            })
          );
        } catch (err) {
          console.warn('Audit log write skipped:', err.message);
        }
      }

          if (name.trim()) {

        } catch (err) {

          render();
        }
      }

      async function signInWithGoogle() {
        state.authLoadingSubmit = true;

      async function createSale(payload) {
        const bizId = state.currentBusiness.id;
        let savedSale = null;

        await runTransaction(db, async (tx) => {
          const bizRef = doc(db, 'businesses', bizId);
          const bizSnap = await tx.get(bizRef);
          if (!bizSnap.exists()) throw new Error('Business not found');
          const bizData = bizSnap.data();

          const productSnaps = [];
          for (const item of payload.items) {
            const pRef = doc(db, 'businesses', bizId, 'products', item.productId);
            const pSnap = await tx.get(pRef);
            if (!pSnap.exists()) throw new Error(`Product "${item.productName}" not found`);
            productSnaps.push({ ref: pRef, snap: pSnap, item });
          }

          let custRef = null;
          let custSnap = null;
          if (payload.customerId) {
            custRef = doc(db, 'businesses', bizId, 'customers', payload.customerId);
            custSnap = await tx.get(custRef);
          }

          let accRef = null;
          let accSnap = null;
          if (payload.accountId && payload.paidAmount > 0) {
            accRef = doc(db, 'businesses', bizId, 'accounts', payload.accountId);
            accSnap = await tx.get(accRef);
          }

          for (const { snap, item } of productSnaps) {
            const avail = Number(snap.data().currentStock || 0);
            if (avail < item.quantity) {
              throw new Error(`Insufficient stock for "${snap.data().name}". Available: ${avail}`);
            }
          }

          const nextNo = Number(bizData.nextInvoiceNumber || 1001);
          const prefix = bizData.invoicePrefix || 'DMS-';
          const invoiceNumber = `${prefix}${nextNo}`;
          const now = new Date().toISOString();
          const saleId = 'sale_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);

          const dueAmount = Math.max(0, Number(payload.total) - Number(payload.paidAmount));
          const status = dueAmount <= 0 ? 'PAID' : Number(payload.paidAmount) > 0 ? 'PARTIAL' : 'DUE';

          savedSale = sanitizeForFirestore({
            id: saleId,
            invoiceNumber,
            customerId: payload.customerId || '',
            customerName: payload.customerName || 'Walk-in Customer',
            customerPhone: payload.customerPhone || '',
            items: payload.items,
            subtotal: Number(payload.subtotal),
            discount: Number(payload.discount || 0),
            tax: Number(payload.tax || 0),
            total: Number(payload.total),
            paidAmount: Number(payload.paidAmount),
            dueAmount,
            paymentMethod: payload.paymentMethod || 'cash',
            accountId: payload.accountId || '',
            status,
            notes: payload.notes || '',
            createdBy: state.user.uid,
            createdByName: state.user.displayName || state.user.email || 'Staff',
            createdAt: now,
          });

          tx.update(bizRef, { nextInvoiceNumber: nextNo + 1, updatedAt: now });
          tx.set(doc(db, 'businesses', bizId, 'sales', saleId), savedSale);

          for (const { ref: pRef, snap, item } of productSnaps) {
            const prevStock = Number(snap.data().currentStock || 0);
            const newStock = prevStock - Number(item.quantity);
            tx.update(pRef, { currentStock: newStock, updatedAt: now });
            const movId = 'mov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            tx.set(
              doc(db, 'businesses', bizId, 'stockMovements', movId),
              sanitizeForFirestore({
                productId: item.productId,
                productName: item.productName,
                type: 'OUT',
                quantity: Number(item.quantity),
                previousStock: prevStock,
                newStock,
                referenceType: 'SALE',
                referenceId: invoiceNumber,
                notes: `Sold via ${invoiceNumber}`,
                createdBy: state.user.uid,
                createdAt: now,
              })
            );
          }

          if (custRef && custSnap && custSnap.exists()) {
            const c = custSnap.data();
            tx.update(custRef, {
              totalPurchases: Number(c.totalPurchases || 0) + Number(payload.total),
              totalPaid: Number(c.totalPaid || 0) + Number(payload.paidAmount),
              currentDue: Number(c.currentDue || 0) + dueAmount,
              updatedAt: now,
            });
          }

          if (accRef && accSnap && accSnap.exists()) {
            tx.update(accRef, {
              balance: Number(accSnap.data().balance || 0) + Number(payload.paidAmount),
              updatedAt: now,
            });
          }

          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: 'SALES',
              action: 'CREATE_SALE',
              details: `Invoice ${invoiceNumber} for ${savedSale.customerName} (${state.currentBusiness.currency}${savedSale.total})`,
              targetId: saleId,
              timestamp: now,
            })
          );
        });

        return savedSale;
      }

      async function adjustProductStock(productId, delta, reason) {
        const bizId = state.currentBusiness.id;
        await runTransaction(db, async (tx) => {
          const pRef = doc(db, 'businesses', bizId, 'products', productId);
          const pSnap = await tx.get(pRef);
          if (!pSnap.exists()) throw new Error('Product not found');
          const p = pSnap.data();
          const prev = Number(p.currentStock || 0);
          const next = Math.max(0, prev + Number(delta));
          const now = new Date().toISOString();
          tx.update(pRef, { currentStock: next, updatedAt: now });
          const movId = 'mov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'stockMovements', movId),
            sanitizeForFirestore({
              productId,
              productName: p.name,
              type: delta >= 0 ? 'IN' : 'OUT',
              quantity: Math.abs(Number(delta)),
              previousStock: prev,
              newStock: next,
              referenceType: 'ADJUSTMENT',
              referenceId: 'ADJ',
              notes: reason || 'Manual stock adjustment',
              createdBy: state.user.uid,
              createdAt: now,
            })
          );
        });
        await logAuditAction('INVENTORY', 'ADJUST_STOCK', `Adjusted stock by ${delta > 0 ? '+' : ''}${delta} (${reason})`, productId);
        showToast('Stock level adjusted!');
      }

      async function transferFunds(fromId, toId, amount, notes = '') {
        if (fromId === toId) throw new Error('Source and destination accounts must be different');
        const bizId = state.currentBusiness.id;
        await runTransaction(db, async (tx) => {
          const fromRef = doc(db, 'businesses', bizId, 'accounts', fromId);
          const toRef = doc(db, 'businesses', bizId, 'accounts', toId);
          const [fromSnap, toSnap] = await Promise.all([tx.get(fromRef), tx.get(toRef)]);
          if (!fromSnap.exists() || !toSnap.exists()) throw new Error('Account not found');
          const amt = Number(amount);
          if (Number(fromSnap.data().balance || 0) < amt) {
            throw new Error(`Insufficient balance in ${fromSnap.data().name}`);
          }
          const now = new Date().toISOString();
          tx.update(fromRef, { balance: Number(fromSnap.data().balance || 0) - amt, updatedAt: now });
          tx.update(toRef, { balance: Number(toSnap.data().balance || 0) + amt, updatedAt: now });
          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: 'ACCOUNTS',
              action: 'FUND_TRANSFER',
              details: `Transferred ${state.currentBusiness.currency}${amt} from ${fromSnap.data().name} to ${toSnap.data().name}${notes ? ' — ' + notes : ''}`,
              timestamp: now,
            })
          );
        });
        showToast('Funds transferred!');
      }

      async function createReturnRecord({ type, referenceId, partyId, partyName, items, totalRefund, accountId, reason }) {
        const bizId = state.currentBusiness.id;
        await runTransaction(db, async (tx) => {
          const prodSnaps = [];
          for (const it of items) {
            const pRef = doc(db, 'businesses', bizId, 'products', it.productId);
            const pSnap = await tx.get(pRef);
            if (pSnap.exists()) prodSnaps.push({ ref: pRef, snap: pSnap, it });
          }
          let partyRef = null;
          let partySnap = null;
          if (partyId) {
            partyRef = doc(db, 'businesses', bizId, type === 'SALE_RETURN' ? 'customers' : 'suppliers', partyId);
            partySnap = await tx.get(partyRef);
          }
          let accRef = null;
          let accSnap = null;
          if (accountId && totalRefund > 0) {
            accRef = doc(db, 'businesses', bizId, 'accounts', accountId);
            accSnap = await tx.get(accRef);
          }

          const now = new Date().toISOString();
          const retId = 'ret_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'returns', retId),
            sanitizeForFirestore({
              id: retId,
              type,
              referenceId,
              partyId: partyId || '',
              partyName: partyName || '',
              items,
              totalAmount: Number(totalRefund),
              reason: reason || 'Returned goods',
              createdBy: state.user.uid,
              createdAt: now,
            })
          );

          for (const { ref: pRef, snap, it } of prodSnaps) {
            const prev = Number(snap.data().currentStock || 0);
            const next = type === 'SALE_RETURN' ? prev + Number(it.quantity) : Math.max(0, prev - Number(it.quantity));
            tx.update(pRef, { currentStock: next, updatedAt: now });
            const movId = 'mov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            tx.set(
              doc(db, 'businesses', bizId, 'stockMovements', movId),
              sanitizeForFirestore({
                productId: it.productId,
                productName: it.productName,
                type: type === 'SALE_RETURN' ? 'IN' : 'OUT',
                quantity: Number(it.quantity),
                previousStock: prev,
                newStock: next,
                referenceType: 'RETURN',
                referenceId,
                notes: `${type === 'SALE_RETURN' ? 'Sales Return' : 'Purchase Return'} (${referenceId})`,
                createdBy: state.user.uid,
                createdAt: now,
              })
            );
          }

          if (partyRef && partySnap && partySnap.exists()) {
            const pd = partySnap.data();
            tx.update(partyRef, {
              currentDue: Math.max(0, Number(pd.currentDue || 0) - Number(totalRefund)),
              updatedAt: now,
            });
          }
          if (accRef && accSnap && accSnap.exists()) {
            const cur = Number(accSnap.data().balance || 0);
            tx.update(accRef, {
              balance: type === 'SALE_RETURN' ? cur - Number(totalRefund) : cur + Number(totalRefund),
              updatedAt: now,
            });
          }
          const logId = 'log_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          tx.set(
            doc(db, 'businesses', bizId, 'auditLogs', logId),
            sanitizeForFirestore({
              userId: state.user.uid,
              userName: state.user.displayName || state.user.email || 'User',
              module: type === 'SALE_RETURN' ? 'SALES' : 'PURCHASES',
              action: type,
              details: `${type} on ${referenceId} (${state.currentBusiness.currency}${totalRefund})`,
              targetId: retId,
              timestamp: now,
            })
          );
        });
        showToast('Return processed & stock adjusted!');
      }

      function renderDashboardCharts() {
        const barEl = document.getElementById('chart-sales-bar');
        const pieEl = document.getElementById('chart-expense-doughnut');
        if (!window.Chart) return;
        if (state.charts.salesBar) {
          state.charts.salesBar.destroy();
          state.charts.salesBar = null;
        }
        if (state.charts.expenseDoughnut) {
          state.charts.expenseDoughnut.destroy();
          state.charts.expenseDoughnut = null;
        }

        if (barEl) {
          const months = [];
          const now = new Date();
          for (let i = 5; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            months.push({
              key: d.toISOString().slice(0, 7),
              label: d.toLocaleString('en-US', { month: 'short' }),
              sales: 0,
              profit: 0,
            });
          }
          state.sales.forEach((s) => {
            const k = (s.createdAt || '').slice(0, 7);
            const m = months.find((x) => x.key === k);
            if (m) {
              m.sales += Number(s.total || 0);
              let cogs = 0;
              (s.items || []).forEach((it) => (cogs += (it.purchasePrice || 0) * (it.quantity || 0)));
              m.profit += Number(s.total || 0) - cogs;
            }
          });
          state.charts.salesBar = new window.Chart(barEl, {
            type: 'bar',
            data: {
              labels: months.map((m) => m.label),
              datasets: [
                { label: 'Sales', data: months.map((m) => m.sales), backgroundColor: '#0284c7', borderRadius: 6 },
                { label: 'Gross Profit', data: months.map((m) => m.profit), backgroundColor: '#10b981', borderRadius: 6 },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: '#334155', font: { size: 11, weight: 'bold' } } } },
              scales: {
                x: { ticks: { color: '#475569' }, grid: { display: false } },
                y: { ticks: { color: '#475569' }, grid: { color: '#e2e8f0' } },
              },
            },
          });
        }

        if (pieEl) {
          const byCat = {};
          state.expenses.forEach((e) => {
            const cat = e.category || 'Other';
            byCat[cat] = (byCat[cat] || 0) + Number(e.amount || 0);
          });
          const labels = Object.keys(byCat);
          const data = Object.values(byCat);
          state.charts.expenseDoughnut = new window.Chart(pieEl, {
            type: 'doughnut',
            data: {
              labels: labels.length ? labels : ['No Expenses'],
              datasets: [
                {
                  data: data.length ? data : [1],

      function renderReportsView() {
        const c = state.currentBusiness.currency || '৳';
        const tf = state.reportsTimeFilter;
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        const monthStr = now.toISOString().slice(0, 7);
        const yearStr = String(now.getFullYear());

        const inRange = (iso) => {
          if (!iso || tf === 'ALL') return true;
          if (tf === 'TODAY') return iso.startsWith(todayStr);
          if (tf === 'MONTH') return iso.startsWith(monthStr);
          if (tf === 'YEAR') return iso.startsWith(yearStr);
          return true;
        };

        const sales = state.sales.filter((s) => inRange(s.createdAt));
        const purchases = state.purchases.filter((p) => inRange(p.createdAt));
        const expenses = state.expenses.filter((e) => inRange(e.date || e.createdAt));

        const totalSales = sales.reduce((s, x) => s + Number(x.total || 0), 0);
        let cogs = 0;
        sales.forEach((s) => (s.items || []).forEach((it) => (cogs += Number(it.purchasePrice || 0) * Number(it.quantity || 0))));
        const grossProfit = totalSales - cogs;
        const totalExpenses = expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
        const netProfit = grossProfit - totalExpenses;
        const m = computeMetrics();

        const tabs = [
          ['PL', 'Profit & Loss'],
          ['BS', 'Balance Sheet'],
          ['SALES', 'Sales Report'],
          ['PURCHASES', 'Purchases Report'],
          ['STOCK', 'Stock Valuation'],
          ['DUES', 'Customer Dues'],
        ];

        let bodyHtml = '';
        if (state.reportsType === 'PL') {
          bodyHtml = `
            <div class="space-y-3 text-sm">
              <div class="flex justify-between p-3 rounded-xl bg-slate-50"><span>Gross Sales Revenue (${sales.length} invoices)</span><strong>${fmtMoney(totalSales, c)}</strong></div>
              <div class="flex justify-between p-3 rounded-xl bg-slate-50"><span>Cost of Goods Sold (COGS)</span><strong class="text-rose-700">-${fmtMoney(cogs, c)}</strong></div>
              <div class="flex justify-between p-3.5 rounded-xl bg-sky-50 border border-sky-200 font-bold text-sky-900"><span>Gross Profit</span><span>${fmtMoney(grossProfit, c)}</span></div>
              <div class="flex justify-between p-3 rounded-xl bg-slate-50"><span>Operating Expenses (${expenses.length} entries)</span><strong class="text-rose-700">-${fmtMoney(totalExpenses, c)}</strong></div>
              <div class="flex justify-between p-4 rounded-2xl ${netProfit >= 0 ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-rose-50 border-rose-200 text-rose-900'} border font-extrabold text-base">
                <span>Net Profit / Loss</span><span>${fmtMoney(netProfit, c)}</span>
              </div>
            </div>`;
        } else if (state.reportsType === 'BS') {
          const totalAssets = m.cashBalance + m.bankBalance + m.mfsBalance + m.inventoryValue + m.totalReceivables;
          const totalLiab = m.totalPayables;
          const equity = totalAssets - totalLiab;
          bodyHtml = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
              <div class="space-y-2">
                <h3 class="font-extrabold text-sm text-slate-900 border-b pb-2">Assets</h3>
                <div class="flex justify-between py-1.5"><span>Cash in Hand</span><strong>${fmtMoney(m.cashBalance, c)}</strong></div>
                <div class="flex justify-between py-1.5"><span>Bank & MFS Accounts</span><strong>${fmtMoney(m.bankBalance + m.mfsBalance, c)}</strong></div>
                <div class="flex justify-between py-1.5"><span>Inventory Stock Value</span><strong>${fmtMoney(m.inventoryValue, c)}</strong></div>
                <div class="flex justify-between py-1.5"><span>Accounts Receivable</span><strong>${fmtMoney(m.totalReceivables, c)}</strong></div>
                <div class="flex justify-between p-3 rounded-xl bg-sky-50 font-extrabold text-sky-900 text-sm"><span>Total Assets</span><span>${fmtMoney(totalAssets, c)}</span></div>
              </div>
              <div class="space-y-2">
                <h3 class="font-extrabold text-sm text-slate-900 border-b pb-2">Liabilities & Equity</h3>
                <div class="flex justify-between py-1.5"><span>Supplier Payables</span><strong class="text-rose-700">${fmtMoney(totalLiab, c)}</strong></div>
                <div class="flex justify-between py-1.5"><span>Owner's Equity (Net Worth)</span><strong class="text-emerald-700">${fmtMoney(equity, c)}</strong></div>
                <div class="flex justify-between p-3 rounded-xl bg-emerald-50 font-extrabold text-emerald-900 text-sm"><span>Total Liabilities + Equity</span><span>${fmtMoney(totalAssets, c)}</span></div>
              </div>
            </div>`;
        } else if (state.reportsType === 'SALES') {
          bodyHtml = `
            <div class="overflow-x-auto">

      function openModal(title, bodyHtml, maxWidth = 'max-w-lg') {
        const host = document.getElementById('app-modals');
        const wrap = document.createElement('div');
        wrap.className = 'fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4 overflow-y-auto';
        wrap.innerHTML = `
          <div class="bg-white border border-sky-200 rounded-3xl ${maxWidth} w-full shadow-2xl overflow-hidden my-auto animate-fade-in">
            <div class="px-6 py-4 bg-sky-50/70 border-b border-sky-100 flex items-center justify-between print:hidden">
              <h3 class="text-base font-extrabold text-slate-900">${esc(title)}</h3>
              <button type="button" class="modal-close p-1.5 rounded-lg text-slate-500 hover:bg-white">✕</button>
            </div>
            <div class="p-6 max-h-[82vh] overflow-y-auto modal-body">${bodyHtml}</div>
          </div>
        `;
        wrap.querySelector('.modal-close').onclick = () => wrap.remove();
        wrap.addEventListener('click', (e) => {
          if (e.target === wrap) wrap.remove();
        });
        host.appendChild(wrap);
        if (window.lucide) window.lucide.createIcons();
        return wrap;
      }

      function openSaleEntryModal() {
        const c = state.currentBusiness.currency || '৳';
        const items = [];
        const modal = openModal(
          'Sale Entry Modal — Instant POS',
          `
            <div class="space-y-4 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Select Customer</label>
                <select id="sm-customer" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-semibold">
                  <option value="">Walk-in Customer</option>
                  ${state.customers.map((cu) => `<option value="${esc(cu.id)}">${esc(cu.name)} (${esc(cu.phone || '')})</option>`).join('')}
                </select>
              </div>
              <div class="flex gap-2">
                <select id="sm-product" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-300 font-semibold">
                  <option value="">-- Choose Product to Add --</option>
                  ${state.products.filter((p) => (p.currentStock || 0) > 0).map((p) => `<option value="${esc(p.id)}">${esc(p.name)} — ${c}${p.salePrice} (${p.currentStock} left)</option>`).join('')}
                </select>
                <button type="button" id="sm-add-btn" class="px-4 py-2 rounded-xl bg-sky-600 text-white font-bold">+ Add</button>
              </div>
              <div id="sm-items" class="border border-slate-200 rounded-2xl divide-y divide-slate-100 max-h-48 overflow-y-auto p-2 text-center text-slate-400">No items added yet.</div>
              <div class="grid grid-cols-3 gap-2">
                <div><label class="block font-bold mb-1">Discount (${esc(c)})</label><input id="sm-discount" type="number" min="0" value="0" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" /></div>
                <div><label class="block font-bold mb-1">Paid (${esc(c)})</label><input id="sm-paid" type="number" min="0" value="0" class="w-full px-3 py-2 rounded-xl border border-emerald-300 bg-emerald-50 font-bold text-emerald-800" /></div>
                <div>
                  <label class="block font-bold mb-1">Account</label>
                  <select id="sm-account" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold">
                    ${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-200 flex justify-between font-extrabold text-sm">
                <span>Grand Total:</span><span id="sm-total">${c}0</span>
              </div>
              <button type="button" id="sm-submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm">Confirm & Save Transaction</button>
            </div>
          `,
          'max-w-xl'
        );

        const refresh = () => {
          const box = modal.querySelector('#sm-items');
          const disc = Number(modal.querySelector('#sm-discount').value || 0);
          const sub = items.reduce((s, it) => s + it.unitPrice * it.quantity, 0);
          const tot = Math.max(0, sub - disc);
          modal.querySelector('#sm-total').textContent = `${c}${tot.toLocaleString()}`;
          if (items.length === 0) {
            box.innerHTML = `<div class="py-4 text-slate-400">No items added yet.</div>`;
          } else {
            box.innerHTML = items
              .map(
                (it, idx) => `
                <div class="p-2 flex items-center justify-between text-left gap-2">
                  <div class="flex-1 font-bold text-slate-900">${esc(it.productName)}</div>
                  <input type="number" min="1" max="${it.maxStock}" value="${it.quantity}" data-sm-qty="${idx}" class="w-14 px-2 py-1 border rounded-lg text-center font-bold" />
                  <span class="font-bold w-20 text-right">${c}${(it.quantity * it.unitPrice).toLocaleString()}</span>
                  <button type="button" data-sm-del="${idx}" class="text-rose-600 font-bold px-1">✕</button>
                </div>`
              )
              .join('');
            box.querySelectorAll('[data-sm-qty]').forEach((inp) => {
              inp.onchange = () => {
                const i = Number(inp.dataset.smQty);
                items[i].quantity = Math.max(1, Math.min(items[i].maxStock, Number(inp.value || 1)));
                modal.querySelector('#sm-paid').value = Math.max(0, items.reduce((s, x) => s + x.unitPrice * x.quantity, 0) - Number(modal.querySelector('#sm-discount').value || 0));
                refresh();
              };
            });
            box.querySelectorAll('[data-sm-del]').forEach((btn) => {
              btn.onclick = () => {
                items.splice(Number(btn.dataset.smDel), 1);
                refresh();
              };
            });
          }
        };

        modal.querySelector('#sm-add-btn').onclick = () => {
          const pid = modal.querySelector('#sm-product').value;
          const p = state.products.find((x) => x.id === pid);
          if (!p) return;
          const ex = items.find((x) => x.productId === pid);
          if (ex) {
            if (ex.quantity < ex.maxStock) ex.quantity++;
          } else {
            items.push({
              productId: p.id,
              productName: p.name,
              quantity: 1,
              unitPrice: Number(p.salePrice || 0),
              purchasePrice: Number(p.purchasePrice || 0),
              maxStock: Number(p.currentStock || 0),
            });
          }
          const sub = items.reduce((s, x) => s + x.unitPrice * x.quantity, 0);
          modal.querySelector('#sm-paid').value = Math.max(0, sub - Number(modal.querySelector('#sm-discount').value || 0));
          refresh();
        };
        modal.querySelector('#sm-discount').oninput = refresh;
        modal.querySelector('#sm-submit').onclick = async () => {
          if (items.length === 0) return showToast('Add at least one product.', 'error');
          const btn = modal.querySelector('#sm-submit');
          btn.disabled = true;
          btn.textContent = 'Processing...';
          try {
            const custId = modal.querySelector('#sm-customer').value;
            const cust = state.customers.find((x) => x.id === custId);
            const disc = Number(modal.querySelector('#sm-discount').value || 0);
            const sub = items.reduce((s, x) => s + x.unitPrice * x.quantity, 0);
            const tot = Math.max(0, sub - disc);
            const paid = Number(modal.querySelector('#sm-paid').value || 0);
            const accId = modal.querySelector('#sm-account').value;
            const sale = await createSale({
              customerId: cust?.id || '',
              customerName: cust?.name || 'Walk-in Customer',
              customerPhone: cust?.phone || '',
              items: items.map(({ maxStock, ...rest }) => rest),
              subtotal: sub,
              discount: disc,
              tax: 0,
              total: tot,
              paidAmount: paid,
              paymentMethod: state.accounts.find((a) => a.id === accId)?.type || 'cash',
              accountId: accId,
            });
            modal.remove();
            showToast(`Invoice ${sale.invoiceNumber} saved!`);
            openInvoicePrintModal(sale, 'SALE');
          } catch (err) {
            showToast(err.message || 'Sale failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Confirm & Save Transaction';
          }
        };
      }

      // ================= RENDER & EVENTS =================
      let renderQueued = false;
      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          render();
        });
      }

      function render() {
        const root = document.getElementById('app-root');
        if (!root) return;

        // Preserve focus for search/typing inputs
        const activeEl = document.activeElement;
        const activeId = activeEl && activeEl.id ? activeEl.id : null;
        const selStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;

        if (state.authLoading) {
          root.innerHTML = `<div class="min-h-screen bg-[#f8fbff] flex flex-col items-center justify-center gap-3"><img src="${LOGO_URL}" referrerpolicy="no-referrer" class="w-16 h-16 rounded-2xl object-contain bg-white p-1.5 border border-sky-200 shadow-lg animate-pulse" /><div class="text-sm font-bold text-slate-700">Connecting to DMS Cloud...</div></div>`;
          return;
        }

        if (!state.user) {
          root.innerHTML = renderAuthView();
          bindAuthEvents();
        } else if (!state.currentBusiness) {
          root.innerHTML = renderWizardView(true);
          bindWizardEvents(true);
        } else {
          let viewHtml = '';
          switch (state.currentView) {
            case 'sales': viewHtml = renderSalesView(); break;
            case 'purchases': viewHtml = renderPurchasesView(); break;
            case 'products': viewHtml = renderProductsView(); break;
            case 'customers': viewHtml = renderCustomersView(); break;
            case 'suppliers': viewHtml = renderSuppliersView(); break;
            case 'accounts': viewHtml = renderAccountsView(); break;
            case 'expenses': viewHtml = renderExpensesView(); break;
            case 'reports': viewHtml = renderReportsView(); break;
            case 'members': viewHtml = renderMembersView(); break;
            case 'audit': viewHtml = renderAuditView(); break;
            case 'settings': viewHtml = renderSettingsView(); break;
            default: viewHtml = renderDashboardView();
          }
          root.innerHTML = renderAppShell(viewHtml);
          bindAppEvents();
          if (state.currentView === 'dashboard') renderDashboardCharts();
        }

        if (window.lucide) window.lucide.createIcons();

        if (activeId) {
          const restored = document.getElementById(activeId);
          if (restored && typeof restored.focus === 'function') {
            restored.focus();
            if (selStart !== null && typeof restored.setSelectionRange === 'function') {
              try {
                restored.setSelectionRange(selStart, selStart);
              } catch {}
            }
          }
        }
      }

      function bindAuthEvents() {
        document.querySelectorAll('[data-action="auth-tab"]').forEach((b) => {
          b.onclick = () => {
            state.authTab = b.dataset.tab;
            state.authError = null;
            render();
          };
        });
        const gBtn = document.getElementById('btn-google-signin');
        if (gBtn) gBtn.onclick = signInWithGoogle;
        const fBtn = document.getElementById('btn-forgot-pw');
        if (fBtn) fBtn.onclick = () => sendPasswordReset(document.getElementById('auth-email-input')?.value || '');
        const form = document.getElementById('auth-email-form');
        if (form) {
          form.onsubmit = (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            if (state.authTab === 'login') signInWithEmail(fd.get('email'), fd.get('password'));
            else signUpWithEmail(fd.get('name') || '', fd.get('email'), fd.get('password'));
          };
        }
      }

      function bindWizardEvents(isFirst, modalWrap = null) {
        const signoutBtn = document.getElementById('btn-wizard-signout');
        if (signoutBtn) signoutBtn.onclick = signOutUser;
        const cancelBtn = document.getElementById('btn-wizard-cancel');
        if (cancelBtn && modalWrap) cancelBtn.onclick = () => modalWrap.remove();
        const prevBtn = document.getElementById('btn-wizard-prev');
        if (prevBtn) prevBtn.onclick = () => { state.wizardStep--; render(); };
        const fileInp = document.getElementById('wizard-logo-file');
        if (fileInp) {
          fileInp.onchange = async (e) => {
            const f = e.target.files?.[0];
            if (f) {
              showToast('Uploading logo...', 'info');
              state.wizardForm.logoUrl = await uploadFileToStorage(f, `logos/${state.user.uid}/${Date.now()}_${f.name}`);
              showToast('Logo uploaded!');
              render();
            }
          };
        }
        const form = document.getElementById('wizard-form');
        if (form) {
          form.onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            for (const [k, v] of fd.entries()) state.wizardForm[k] = v.toString();
            if (state.wizardStep < 3) {
              state.wizardStep++;
              render();
            } else {
              const btn = document.getElementById('btn-wizard-next');
              if (btn) { btn.disabled = true; btn.textContent = 'Launching...'; }
              try {
                await createNewBusiness(state.wizardForm);
                state.wizardStep = 1;
                if (modalWrap) modalWrap.remove();
              } catch (err) {
                showToast(err.message || 'Failed to launch workspace', 'error');
                if (btn) { btn.disabled = false; btn.textContent = 'Launch Business Dashboard 🚀'; }
              }
            }
          };
        }
      }

      function bindAppEvents() {
        document.querySelectorAll('[data-nav]').forEach((b) => {

            state.mobileSidebarOpen = false;
            render();

        if (clsSide) clsSide.onclick = () => { state.mobileSidebarOpen = false; render(); };
        const bdSide = document.getElementById('mobile-sidebar-backdrop');
        if (bdSide) bdSide.onclick = () => { state.mobileSidebarOpen = false; render(); };
        const outBtn = document.getElementById('btn-nav-signout');
        if (outBtn) outBtn.onclick = signOutUser;
