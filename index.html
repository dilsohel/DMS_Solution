          return;
        }
        const biz = state.currentBusiness || {};
        const sm = data.summary;
        const inRange = (dt) => {
          const day = String(dt || '').slice(0, 10);
          if (!day || day === '-') return true;
          if (fromDate && day < fromDate) return false;
          if (toDate && day > toDate) return false;
          return true;
        };
        const rowsStmt = data.statementRows.filter((r) => inRange(r.date));
        const rowsPur = data.purchases.filter((p) => inRange(p.createdAt));
        const rowsPay = data.payments.filter((pm) => inRange(pm.date || pm.createdAt));
        const rangeLabel = fromDate || toDate ? `${fromDate || 'Start'} to ${toDate || 'Today'}` : 'All Time';

        const { doc, startY, marginX, addFooters } = createStyledPdfDoc({
          title: 'Supplier Ledger Statement',
          subtitle: `${sup.name}${sup.company ? ' (' + sup.company + ')' : ''} | ${sup.phone || ''}`,
          periodLabel: rangeLabel,
          kpis: [
            { label: 'Total Purchased', value: fmtMoneyPdf(sm.totalPurchased, biz), color: [15, 23, 42] },
            { label: 'Total Paid', value: fmtMoneyPdf(sm.totalPaidAll, biz), color: [5, 150, 105] },
            { label: 'Returns Adjusted', value: fmtMoneyPdf(sm.totalReturnedDueAdj, biz), color: [217, 119, 6] },
            { label: 'Current Due', value: fmtMoneyPdf(sm.currentDue, biz), color: sm.currentDue > 0 ? [225, 29, 72] : [5, 150, 105] },
          ],
          orientation: 'portrait',
        });

        const baseOpts = {
          startY,
          margin: { left: marginX, right: marginX, bottom: 44 },
          styles: { font: 'helvetica', fontSize: 8.2, cellPadding: 5.5, textColor: [15, 23, 42], lineColor: [226, 232, 240], lineWidth: 0.4 },
          headStyles: { fillColor: [15, 23, 42], textColor: [255, 255, 255], fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [248, 250, 252] },
        };

        if (activeTab === 'purchases') {
          doc.autoTable({
            ...baseOpts,
            head: [['Bill #', 'Date', 'Items', 'Total', 'Paid', 'Due', 'Status']],
            body: rowsPur.length === 0
              ? [['-', 'No purchase bills found.', '-', '-', '-', '-', '-']]
              : rowsPur.map((p) => [
                  pdfSafeText(p.billNumber),
                  pdfSafeText((p.createdAt || '').slice(0, 10)),
                  pdfSafeText((p.items || []).map((it) => `${it.productName} x${it.quantity}`).join(', ')),
                  fmtMoneyPdf(p.total, biz),
                  fmtMoneyPdf(p.paidAmount, biz),
                  fmtMoneyPdf(p.dueAmount, biz),
                  pdfSafeText(p.status || 'DUE'),
                ]),
            columnStyles: { 3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'right', fontStyle: 'bold' } },
          });
        } else if (activeTab === 'payments') {
          doc.autoTable({
            ...baseOpts,
            head: [['Date', 'Payment Ref', 'Account', 'Linked Bill', 'Notes', 'Amount Paid']],
            body: rowsPay.length === 0
              ? [['-', 'No supplier payments recorded.', '-', '-', '-', '-']]
              : rowsPay.map((pm) => [
                  pdfSafeText(pm.date || '-'),
                  pdfSafeText(pm.ref),
                  pdfSafeText(pm.accountName),
                  pdfSafeText(pm.billNumber || 'General A/C'),
                  pdfSafeText(pm.notes || '-'),
                  fmtMoneyPdf(pm.amount, biz),
                ]),
            columnStyles: { 5: { halign: 'right', fontStyle: 'bold', textColor: [5, 150, 105] } },
          });
        } else {
          doc.autoTable({
            ...baseOpts,
            head: [['Date', 'Ref #', 'Particulars', 'Billed (+)', 'Paid / Adj (-)', 'Running Due']],
            body: rowsStmt.length === 0
              ? [['-', '-', 'No transactions found.', '-', '-', '-']]
              : rowsStmt.map((r) => [
                  pdfSafeText(r.date),
                  pdfSafeText(r.ref),
                  pdfSafeText(`${r.description}${r.subtext ? ' (' + r.subtext + ')' : ''}`),
                  r.billed > 0 ? fmtMoneyPdf(r.billed, biz) : '-',
                  r.paid + r.returnedDue > 0 ? `-${fmtMoneyPdf(r.paid + r.returnedDue, biz)}` : '-',
                  fmtMoneyPdf(r.runningBalance, biz),
                ]),
            columnStyles: { 3: { halign: 'right' }, 4: { halign: 'right', textColor: [5, 150, 105] }, 5: { halign: 'right', fontStyle: 'bold' } },
          });
        }

        addFooters();
        const slug = (sup.name || 'supplier').toLowerCase().replace(/[^a-z0-9]+/g, '-');
        doc.save(`dms-supplier-ledger-${slug}-${new Date().toISOString().slice(0, 10)}.pdf`);
        showToast('Supplier ledger PDF exported!');
      }

      function openModal(title, bodyHtml, maxWidth = 'max-w-lg') {
        const host = document.getElementById('app-modals');
        const wrap = document.createElement('div');
        wrap.className = 'fixed inset-0 z-[90] flex items-center justify-center bg-slate-900/50 backdrop-blur-xs p-4 overflow-y-auto';
        wrap.innerHTML = `
          <div class="bg-white border border-sky-200 rounded-3xl ${maxWidth} w-full shadow-2xl overflow-hidden my-auto animate-fade-in">
            <div class="px-6 py-4 bg-sky-50/70 border-b border-sky-100 flex items-center justify-between print:hidden">
              <h3 class="text-base font-extrabold text-slate-900">${esc(title)}</h3>
              <button type="button" class="modal-close p-1.5 rounded-lg text-slate-500 hover:bg-white">✕</button>
            </div>
            <div class="p-6 max-h-[82vh] overflow-y-auto modal-body">${bodyHtml}</div>
          </div>
        `;
        wrap.querySelector('.modal-close').onclick = () => wrap.remove();
        wrap.addEventListener('click', (e) => {
          if (e.target === wrap) wrap.remove();
        });
        host.appendChild(wrap);
        if (window.lucide) window.lucide.createIcons();
        return wrap;
      }

      function openSaleEntryModal() {
        const c = state.currentBusiness.currency || '৳';
        const items = [];
        const modal = openModal(
          'Sale Entry Modal — Instant POS',
          `
            <div class="space-y-4 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Select Customer</label>
                <select id="sm-customer" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-semibold">
                  <option value="">Walk-in Customer</option>
                  ${state.customers.map((cu) => `<option value="${esc(cu.id)}">${esc(cu.name)} (${esc(cu.phone || '')})</option>`).join('')}
                </select>
              </div>
              <div class="flex gap-2">
                <select id="sm-product" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-300 font-semibold">
                  <option value="">-- Choose Product to Add --</option>
                  ${state.products.filter((p) => (p.currentStock || 0) > 0).map((p) => `<option value="${esc(p.id)}">${esc(p.name)} — ${c}${p.salePrice} (${p.currentStock} left)</option>`).join('')}
                </select>
                <button type="button" id="sm-add-btn" class="px-4 py-2 rounded-xl bg-sky-600 text-white font-bold">+ Add</button>
              </div>
              <div id="sm-items" class="border border-slate-200 rounded-2xl divide-y divide-slate-100 max-h-48 overflow-y-auto p-2 text-center text-slate-400">No items added yet.</div>
              <div class="grid grid-cols-3 gap-2">
                <div><label class="block font-bold mb-1">Discount (${esc(c)})</label><input id="sm-discount" type="number" min="0" value="0" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" /></div>
                <div><label class="block font-bold mb-1">Paid (${esc(c)})</label><input id="sm-paid" type="number" min="0" value="0" class="w-full px-3 py-2 rounded-xl border border-emerald-300 bg-emerald-50 font-bold text-emerald-800" /></div>
                <div>
                  <label class="block font-bold mb-1">Account</label>
                  <select id="sm-account" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold">
                    ${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-200 flex justify-between font-extrabold text-sm">
                <span>Grand Total:</span><span id="sm-total">${c}0</span>
              </div>
              <button type="button" id="sm-submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm">Confirm & Save Transaction</button>
            </div>
          `,
          'max-w-xl'
        );

        const refresh = () => {
          const box = modal.querySelector('#sm-items');
          const disc = Number(modal.querySelector('#sm-discount').value || 0);
          const sub = items.reduce((s, it) => s + it.unitPrice * it.quantity, 0);
          const tot = Math.max(0, sub - disc);
          modal.querySelector('#sm-total').textContent = `${c}${tot.toLocaleString()}`;
          if (items.length === 0) {
            box.innerHTML = `<div class="py-4 text-slate-400">No items added yet.</div>`;
          } else {
            box.innerHTML = items
              .map(
                (it, idx) => `
                <div class="p-2 flex items-center justify-between text-left gap-2">
                  <div class="flex-1 font-bold text-slate-900">${esc(it.productName)}</div>
                  <input type="number" min="1" max="${it.maxStock}" value="${it.quantity}" data-sm-qty="${idx}" class="w-14 px-2 py-1 border rounded-lg text-center font-bold" />
                  <span class="font-bold w-20 text-right">${c}${(it.quantity * it.unitPrice).toLocaleString()}</span>
                  <button type="button" data-sm-del="${idx}" class="text-rose-600 font-bold px-1">✕</button>
                </div>`
              )
              .join('');
            box.querySelectorAll('[data-sm-qty]').forEach((inp) => {
              inp.onchange = () => {
                const i = Number(inp.dataset.smQty);
                items[i].quantity = Math.max(1, Math.min(items[i].maxStock, Number(inp.value || 1)));
                modal.querySelector('#sm-paid').value = Math.max(0, items.reduce((s, x) => s + x.unitPrice * x.quantity, 0) - Number(modal.querySelector('#sm-discount').value || 0));
                refresh();
              };
            });
            box.querySelectorAll('[data-sm-del]').forEach((btn) => {
              btn.onclick = () => {
                items.splice(Number(btn.dataset.smDel), 1);
                refresh();
              };
            });
          }
        };

        modal.querySelector('#sm-add-btn').onclick = () => {
          const pid = modal.querySelector('#sm-product').value;
          const p = state.products.find((x) => x.id === pid);
          if (!p) return;
          const ex = items.find((x) => x.productId === pid);
          if (ex) {
            if (ex.quantity < ex.maxStock) ex.quantity++;
          } else {
            items.push({
              productId: p.id,
              productName: p.name,
              quantity: 1,
              unitPrice: Number(p.salePrice || 0),
              purchasePrice: Number(p.purchasePrice || 0),
              maxStock: Number(p.currentStock || 0),
            });
          }
          const sub = items.reduce((s, x) => s + x.unitPrice * x.quantity, 0);
          modal.querySelector('#sm-paid').value = Math.max(0, sub - Number(modal.querySelector('#sm-discount').value || 0));
          refresh();
        };
        modal.querySelector('#sm-discount').oninput = refresh;
        modal.querySelector('#sm-submit').onclick = async () => {
          if (items.length === 0) return showToast('Add at least one product.', 'error');
          const btn = modal.querySelector('#sm-submit');
          btn.disabled = true;
          btn.textContent = 'Processing...';
          try {
            const custId = modal.querySelector('#sm-customer').value;
            const cust = state.customers.find((x) => x.id === custId);
            const disc = Number(modal.querySelector('#sm-discount').value || 0);
            const sub = items.reduce((s, x) => s + x.unitPrice * x.quantity, 0);
            const tot = Math.max(0, sub - disc);
            const paid = Number(modal.querySelector('#sm-paid').value || 0);
            const accId = modal.querySelector('#sm-account').value;
            const sale = await createSale({
              customerId: cust?.id || '',
              customerName: cust?.name || 'Walk-in Customer',
              customerPhone: cust?.phone || '',
              items: items.map(({ maxStock, ...rest }) => rest),
              subtotal: sub,
              discount: disc,
              tax: 0,
              total: tot,
              paidAmount: paid,
              paymentMethod: state.accounts.find((a) => a.id === accId)?.type || 'cash',
              accountId: accId,
            });
            modal.remove();
            showToast(`Invoice ${sale.invoiceNumber} saved!`);
            openInvoicePrintModal(sale, 'SALE');
          } catch (err) {
            showToast(err.message || 'Sale failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Confirm & Save Transaction';
          }
        };
      }

      function openPaySupplierModal(sup, preselectedBillId = '', onPaid = null) {
        if (!sup) return;
        const c = state.currentBusiness.currency || '৳';
        const openBills = state.purchases
          .filter((p) => (p.supplierId === sup.id || (!p.supplierId && p.supplierName === sup.name)) && Number(p.dueAmount || 0) > 0)
          .sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
        const matchedBill = preselectedBillId ? openBills.find((b) => b.id === preselectedBillId) : null;
        const defaultAmt = matchedBill ? Number(matchedBill.dueAmount || 0) : Number(sup.currentDue || 0);

        const m = openModal(
          `Record Supplier Payment — ${sup.name}`,
          `
            <form id="pay-sup-form" class="space-y-3 text-xs">
              <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 flex items-center justify-between">
                <span class="text-slate-600 font-semibold">Current Outstanding Due</span>
                <strong class="text-base text-rose-700">${fmtMoney(sup.currentDue || 0, c)}</strong>
              </div>
              <div>
                <label class="block font-bold mb-1">Apply Payment To</label>
                <select name="purchaseId" id="pay-sup-bill-select" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 font-semibold">
                  <option value="">General Account Payment (Overall Due)</option>
                  ${openBills
                    .map(
                      (b) => `<option value="${esc(b.id)}" data-due="${Number(b.dueAmount || 0)}" ${preselectedBillId === b.id ? 'selected' : ''}>${esc(b.billNumber)} (${esc((b.createdAt || '').slice(0, 10))}) — Due: ${fmtMoney(b.dueAmount, c)}</option>`
                    )
                    .join('')}
                </select>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold mb-1">Amount Paid *</label>
                  <input id="pay-sup-amount" name="amount" type="number" min="1" step="any" required value="${defaultAmt > 0 ? defaultAmt : ''}" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Payment Date</label>
                  <input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                </div>
              </div>
              <div>
                <label class="block font-bold mb-1">Pay From Account</label>
                <select name="accountId" class="w-full px-3 py-2 rounded-xl border border-slate-300">
                  ${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)} (${fmtMoney(a.balance, c)})</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block font-bold mb-1">Notes / Reference (Check #, bKash TrxID, etc.)</label>
                <input name="notes" placeholder="Optional payment reference..." class="w-full px-3 py-2 rounded-xl border border-slate-300" />
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm">Record Supplier Payment</button>
            </form>
          `
        );

        const billSel = m.querySelector('#pay-sup-bill-select');
        const amtInput = m.querySelector('#pay-sup-amount');
        if (billSel && amtInput) {
          billSel.onchange = () => {
            const opt = billSel.options[billSel.selectedIndex];
            const d = opt ? Number(opt.dataset.due || 0) : 0;
            if (d > 0) amtInput.value = d;
            else if (Number(sup.currentDue || 0) > 0) amtInput.value = Number(sup.currentDue || 0);
          };
        }

        m.querySelector('#pay-sup-form').onsubmit = async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          try {
            await paySupplier(
              sup.id,
              Number(fd.get('amount')),
              fd.get('accountId').toString(),
              fd.get('notes').toString().trim(),
              {
                purchaseId: fd.get('purchaseId').toString(),
                date: fd.get('date').toString(),
              }
            );
            m.remove();
            if (onPaid) onPaid();
          } catch (err) {
            showToast(err?.message || 'Payment failed', 'error');
          }
        };
      }

              <!-- Controls Bar (Hidden when printing) -->
              <div class="flex flex-wrap items-center justify-between gap-2 print:hidden">

          });
          const fInp = root.querySelector('#sl-from-date');
          const tInp = root.querySelector('#sl-to-date');
          if (fInp) fInp.onchange = () => { fromDate = fInp.value; renderLedgerContent(); };
          if (tInp) tInp.onchange = () => { toDate = tInp.value; renderLedgerContent(); };
          const clrBtn = root.querySelector('#btn-sl-clear-dates');
          if (clrBtn) clrBtn.onclick = () => { fromDate = ''; toDate = ''; renderLedgerContent(); };

          const payNowBtn = root.querySelector('#btn-sl-pay-now');
          if (payNowBtn) payNowBtn.onclick = () => openPaySupplierModal(sup, '', () => renderLedgerContent());

          const newBillBtn = root.querySelector('#btn-sl-new-bill');
          if (newBillBtn) {
            newBillBtn.onclick = () => {
              modal.remove();
              state.currentView = 'purchases';
              state.purchasesTab = 'create';
              state.purchasesSupplierId = sup.id;
              render();
            };
          }

          const expBtn = root.querySelector('#btn-sl-export-csv');
          if (expBtn) {
            expBtn.onclick = () => {
              const rows = [
                ['Supplier', sup.name, 'Phone', sup.phone || '', 'Current Due', sm.currentDue],
                [],
                ['Date', 'Reference', 'Type', 'Particulars', 'Details', 'Billed (+)', 'Paid / Adjusted (-)', 'Running Due'],
                ...filteredStatement.map((r) => [r.date, r.ref, r.kind, r.description, r.subtext, r.billed, r.paid + r.returnedDue, r.runningBalance]),
              ];
              const blob = new Blob([rows.map((r) => r.map((x) => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = `supplier-ledger-${(sup.name || 'supplier').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${new Date().toISOString().slice(0, 10)}.csv`;
              a.click();
            };
          }
          const expPdfBtn = root.querySelector('#btn-sl-export-pdf');
          if (expPdfBtn) {
            expPdfBtn.onclick = () => exportSupplierLedgerPdf(sup, data, activeTab, fromDate, toDate);
          }

          root.querySelectorAll('[data-sl-pay-bill]').forEach((b) => {
            b.onclick = () => openPaySupplierModal(sup, b.dataset.slPayBill, () => renderLedgerContent());
          });
          root.querySelectorAll('[data-sl-print-bill]').forEach((b) => {
            b.onclick = () => {
              const p = state.purchases.find((x) => x.id === b.dataset.slPrintBill);
              if (p) openInvoicePrintModal(p, 'PURCHASE');
            };
          });
          root.querySelectorAll('[data-sl-ret-bill]').forEach((b) => {
            b.onclick = () => {
              const p = state.purchases.find((x) => x.id === b.dataset.slRetBill);
              if (p) {
                modal.remove();
                openReturnModal('PURCHASE_RETURN', p);
              }
            };
          });
        }

        root._refreshLedger = renderLedgerContent;
        renderLedgerContent();
      }

      function openReturnModal(defaultType = 'SALE_RETURN', preselectedDoc = null) {
        const c = state.currentBusiness.currency || '৳';
        const isSale = defaultType === 'SALE_RETURN';
        const docs = isSale ? state.sales : state.purchases;
        let selectedDoc = preselectedDoc || docs[0] || null;

        const modal = openModal(
          isSale ? 'Process Sales Return (Customer)' : 'Process Purchase Return (Supplier)',
          `<div id="ret-modal-body" class="space-y-4 text-xs"></div>`,
          'max-w-2xl'
        );
        const body = modal.querySelector('#ret-modal-body');

        function renderModalBody() {
          const items = selectedDoc?.items || [];
          const partyDue = selectedDoc ? Number(selectedDoc.dueAmount || 0) : 0;
          body.innerHTML = `
            <form id="ret-form" class="space-y-4">
              <div>
                <label class="block font-bold text-slate-700 mb-1">${isSale ? 'Select Sales Invoice' : 'Select Purchase Bill'}</label>
                <select id="ret-doc-select" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-slate-50 font-semibold">
                  ${
                    docs.length === 0
                      ? '<option value="">No invoices/bills found</option>'
                      : docs
                          .map((d) => {
                            const refNo = isSale ? d.invoiceNumber : d.billNumber;
                            const party = isSale ? d.customerName : d.supplierName;
                            return `<option value="${esc(d.id)}" ${selectedDoc?.id === d.id ? 'selected' : ''}>${esc(refNo)} — ${esc(party)} (${fmtMoney(d.total, c)})</option>`;
                          })
                          .join('')
                  }
                </select>
              </div>
              ${
                !selectedDoc
                  ? `<div class="p-6 rounded-xl bg-slate-50 text-center text-slate-500">No ${isSale ? 'sales invoices' : 'purchase bills'} available to return.</div>`
                  : `<div class="border border-slate-200 rounded-xl overflow-hidden">
                      <div class="bg-slate-50 px-3 py-2 flex items-center justify-between border-b border-slate-200">
                        <span class="font-bold text-slate-700">Select Items & Quantities to Return</span>
                        <button type="button" id="btn-ret-all-qty" class="text-[11px] font-bold text-sky-700 hover:underline">Return All</button>
                      </div>
                      <div class="divide-y divide-slate-100 max-h-56 overflow-y-auto">
                        ${items
                          .map((it, idx) => {
                            const rate = Number(isSale ? it.unitPrice : it.unitCost || 0);
                            return `
                              <div class="p-3 flex items-center justify-between gap-3">
                                <div class="min-w-0 flex-1">
                                  <div class="font-bold text-slate-900 truncate">${esc(it.productName)}</div>
                                  <div class="text-[11px] text-slate-500">Orig Qty: ${it.quantity} × ${fmtMoney(rate, c)}</div>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                  <label class="text-[11px] text-slate-500">Return Qty:</label>
                                  <input type="number" min="0" max="${it.quantity}" value="${preselectedDoc ? it.quantity : 0}" data-ret-qty="${idx}" data-ret-rate="${rate}" class="w-16 px-2 py-1 rounded-lg border border-slate-300 font-bold text-center" />
                                </div>
                              </div>`;
                          })
                          .join('')}
                      </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label class="block font-bold mb-1">Total Return Value (${esc(c)})</label>
                        <input id="ret-total-val" type="number" min="0" step="any" readonly class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-100 font-extrabold text-slate-900" />
                      </div>
                      <div>
                        <label class="block font-bold mb-1">Adjust Party Due (${esc(c)})</label>
                        <input id="ret-due-adj" name="dueAdjusted" type="number" min="0" step="any" value="0" class="w-full px-3 py-2 rounded-xl border border-emerald-300 bg-emerald-50/40 font-bold text-emerald-800" />
                      </div>
                      <div>
                        <label class="block font-bold mb-1">${isSale ? 'Cash Refund Paid' : 'Cash Refund Received'} (${esc(c)})</label>
                        <input id="ret-cash-ref" name="cashRefund" type="number" min="0" step="any" value="0" class="w-full px-3 py-2 rounded-xl border border-rose-300 bg-rose-50/40 font-bold text-rose-800" />
                      </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label class="block font-bold mb-1">${isSale ? 'Refund From Account' : 'Deposit Refund To Account'}</label>
                        <select name="accountId" class="w-full px-3 py-2 rounded-xl border border-slate-300">
                          ${state.accounts.map((a) => `<option value="${esc(a.id)}" ${selectedDoc.accountId === a.id ? 'selected' : ''}>${esc(a.name)} (${fmtMoney(a.balance, c)})</option>`).join('')}
                        </select>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">Return Reason *</label>
                        <input name="reason" required value="Customer/Quality Return" class="w-full px-3 py-2 rounded-xl border border-slate-300" />
                      </div>
                    </div>

                    <button type="submit" class="w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-sm shadow-md">
                      Confirm ${isSale ? 'Sales Return & Restore Stock' : 'Purchase Return & Deduct Stock'}
                    </button>`
              }
            </form>
          `;

          const docSel = body.querySelector('#ret-doc-select');
          if (docSel) {
            docSel.onchange = () => {
              selectedDoc = docs.find((d) => d.id === docSel.value) || null;
              renderModalBody();
            };
          }

          const recalcTotals = () => {
            let sum = 0;
            body.querySelectorAll('[data-ret-qty]').forEach((inp) => {
              const q = Math.max(0, Math.min(Number(inp.max || 0), Number(inp.value || 0)));
              inp.value = q;
              sum += q * Number(inp.dataset.retRate || 0);
            });
            const totEl = body.querySelector('#ret-total-val');
            const dueEl = body.querySelector('#ret-due-adj');
            const cashEl = body.querySelector('#ret-cash-ref');
            if (totEl) totEl.value = sum;
            const autoDue = Math.min(sum, partyDue);
            if (dueEl) dueEl.value = autoDue;
            if (cashEl) cashEl.value = Math.max(0, sum - autoDue);
          };

          body.querySelectorAll('[data-ret-qty]').forEach((inp) => {
            inp.oninput = recalcTotals;
          });
          const retAllBtn = body.querySelector('#btn-ret-all-qty');
          if (retAllBtn) {
            retAllBtn.onclick = () => {
              body.querySelectorAll('[data-ret-qty]').forEach((inp) => {
                inp.value = inp.max;
              });
              recalcTotals();
            };
          }
          const dueEl = body.querySelector('#ret-due-adj');
          const cashEl = body.querySelector('#ret-cash-ref');
          if (dueEl && cashEl) {
            dueEl.oninput = () => {
              const tot = Number(body.querySelector('#ret-total-val')?.value || 0);
              const d = Math.max(0, Math.min(tot, Number(dueEl.value || 0)));
              cashEl.value = Math.max(0, tot - d);
            };
          }

          recalcTotals();

          const form = body.querySelector('#ret-form');
          if (form && selectedDoc) {
            form.onsubmit = async (e) => {
              e.preventDefault();
              const retItems = [];
              body.querySelectorAll('[data-ret-qty]').forEach((inp) => {
                const qty = Number(inp.value || 0);
                if (qty > 0) {
                  const orig = items[Number(inp.dataset.retQty)];
                  retItems.push({ ...orig, quantity: qty });
                }
              });
              if (retItems.length === 0) return showToast('Set return quantity > 0 for at least one item.', 'error');
              const fd = new FormData(form);
              const totalVal = Number(body.querySelector('#ret-total-val')?.value || 0);
              const dueAdj = Number(fd.get('dueAdjusted') || 0);
              const cashRef = Number(fd.get('cashRefund') || 0);
              try {
                const saved = await createReturnRecord({
                  type: defaultType,
                  referenceId: isSale ? selectedDoc.invoiceNumber : selectedDoc.billNumber,
                  partyId: isSale ? selectedDoc.customerId : selectedDoc.supplierId,
                  partyName: isSale ? selectedDoc.customerName : selectedDoc.supplierName,
                  items: retItems,
                  totalRefund: totalVal,
                  dueAdjusted: dueAdj,
                  cashRefund: cashRef,
                  accountId: fd.get('accountId').toString(),
                  reason: fd.get('reason').toString(),
                });
                modal.remove();
                if (saved) openReturnPrintModal(saved);
              } catch (err) {
                showToast(err?.message || 'Return failed', 'error');
              }
            };
          }
        }
        renderModalBody();
      }

      function wireSubscriptionPaymentContainer(container, onSuccess = null) {
        container.querySelectorAll('[data-pay-method]').forEach((card) => {
          card.onclick = (e) => {
            if (e.target.closest('[data-copy-num]') || e.target.closest('[data-qr-zoom]')) return;
            state.billingSelectedMethod = card.dataset.payMethod;
            const inp = container.querySelector('#sub-method-input');
            if (inp) inp.value = state.billingSelectedMethod;
            container.querySelectorAll('[data-pay-method]').forEach((c2) => {
              const m = c2.dataset.payMethod;
              const active = m === state.billingSelectedMethod;
              c2.className = `cursor-pointer rounded-2xl p-4 border-2 transition ${
                active
                  ? m === 'bkash'
                    ? 'border-pink-500 bg-pink-50/70 shadow-sm'
                    : 'border-orange-500 bg-orange-50/70 shadow-sm'
                  : 'border-slate-200 bg-white'
              }`;
            });
          };
        });
        container.querySelectorAll('[data-qr-zoom]').forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            openQrZoomModal(btn.dataset.qrZoom);
          };
        });
        container.querySelectorAll('[data-copy-num]').forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const num = btn.dataset.copyNum;
            const lbl = btn.dataset.copyLabel;
            navigator.clipboard?.writeText(num);
            showToast(`${lbl} নাম্বার ${num} কপি করা হয়েছে!`, 'info');
          };
        });
        const form = container.querySelector('#sub-payment-form');
        if (form) {
          form.onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            const errBox = container.querySelector('#sub-pay-err');
            const submitBtn = container.querySelector('#sub-pay-submit');
            if (errBox) errBox.classList.add('hidden');
            if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Submitting...'; }
            try {
              await submitSubscriptionPayment({
                method: fd.get('method').toString(),
                senderPhone: fd.get('senderPhone').toString(),
                trxId: fd.get('trxId').toString(),
              });
              if (onSuccess) onSuccess();
            } catch (err) {
              if (errBox) {
                errBox.textContent = err.message || 'Invalid transaction details';
                errBox.classList.remove('hidden');
              }
              if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'সাবমিট করুন (Submit for Admin Approval)'; }
            }
          };
        }
      }

      function openSubscriptionPaymentModal() {
        const modal = openModal(

          renderSubscriptionPaymentBody(false),
          'max-w-xl'

        wireSubscriptionPaymentContainer(modal, () => modal.remove());

      let renderQueued = false;
      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          render();
        });
      }

      function render() {
        const root = document.getElementById('app-root');
        if (!root) return;

        // Preserve focus for search/typing inputs
        const activeEl = document.activeElement;
        const activeId = activeEl && activeEl.id ? activeEl.id : null;
        const selStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;

        if (state.authLoading) {
          root.innerHTML = `<div class="min-h-screen bg-[#f8fbff] flex flex-col items-center justify-center gap-3"><img src="${LOGO_URL}" referrerpolicy="no-referrer" class="w-16 h-16 rounded-2xl object-contain bg-white p-1.5 border border-sky-200 shadow-lg animate-pulse" /><div class="text-sm font-bold text-slate-700">Connecting to DMS Cloud...</div></div>`;
          return;
        }

        if (!state.user) {
          root.innerHTML = renderAuthView();
          bindAuthEvents();
        } else if (isSuperAdminUser()) {
          root.innerHTML = renderAdminPanelView();
          bindAdminEvents();
        } else if (getBillingStatus().isLocked) {
          root.innerHTML = renderLockedPaywallView();
          const lockOut = document.getElementById('btn-lock-signout');
          if (lockOut) lockOut.onclick = signOutUser;
          const lockBody = document.getElementById('lock-paywall-body');
          if (lockBody) wireSubscriptionPaymentContainer(lockBody);
        } else if (!state.currentBusiness) {
          root.innerHTML = renderWizardView(true);
          bindWizardEvents(true);
        } else {
          let viewHtml = '';
          switch (state.currentView) {
            case 'sales': viewHtml = renderSalesView(); break;
            case 'purchases': viewHtml = renderPurchasesView(); break;
            case 'returns': viewHtml = renderReturnsView(); break;
            case 'products': viewHtml = renderProductsView(); break;
            case 'customers': viewHtml = renderCustomersView(); break;
            case 'suppliers': viewHtml = renderSuppliersView(); break;
            case 'accounts': viewHtml = renderAccountsView(); break;
            case 'expenses': viewHtml = renderExpensesView(); break;
            case 'reports': viewHtml = renderReportsView(); break;
            case 'members': viewHtml = renderMembersView(); break;
            case 'audit': viewHtml = renderAuditView(); break;
            case 'settings': viewHtml = renderSettingsView(); break;
            default: viewHtml = renderDashboardView();
          }
          root.innerHTML = renderAppShell(viewHtml);
          bindAppEvents();
          if (state.currentView === 'dashboard') renderDashboardCharts();
          maybeTriggerUrgentBillingAlert();
        }

        if (window.lucide) window.lucide.createIcons();
        const openSupLedger = document.getElementById('sup-ledger-root');
        if (openSupLedger && typeof openSupLedger._refreshLedger === 'function') {
          openSupLedger._refreshLedger();
        }

        if (activeId) {
          const restored = document.getElementById(activeId);
          if (restored && typeof restored.focus === 'function') {
            restored.focus();
            if (selStart !== null && typeof restored.setSelectionRange === 'function') {
              try {
                restored.setSelectionRange(selStart, selStart);
              } catch {}
            }
          }
        }
      }

        const form = document.getElementById('wizard-form');

          if (!form) return;
          const fd = new FormData(form);
          for (const [k, v] of fd.entries()) state.wizardForm[k] = v.toString();

        if (form) {

          wizLogoUrlInp.oninput = () => {

            if (prev) prev.innerHTML = renderShopLogoHtml({ name: state.wizardForm.name || 'Shop', logoUrl: state.wizardForm.logoUrl }, 'w-11 h-11', 'text-xs');
          };

        const fileInp = document.getElementById('wizard-logo-file');

            const f = e.target.files?.[0];

            syncWizardFields();
            showToast('Uploading shop logo...', 'info');

              if (wizLogoUrlInp) wizLogoUrlInp.value = url;
              const prev = document.getElementById('wizard-logo-preview');
              if (prev) prev.innerHTML = renderShopLogoHtml({ name: state.wizardForm.name || 'Shop', logoUrl: url }, 'w-11 h-11', 'text-xs');
              showToast('Shop logo ready!');
            } catch (err) {
              showToast('Logo upload failed: ' + (err?.message || 'Try a smaller image'), 'error');
            } finally {
              pendingLogoUpload = null;
            }
          };
        }

            const m = openModal(
              `Collect Due — ${cust.name}`,
              `<form id="col-form" class="space-y-3 text-xs"><div>Current Due: <strong class="text-rose-600">${fmtMoney(cust.currentDue || 0, state.currentBusiness.currency)}</strong></div><div><label class="block font-bold mb-1">Amount Received *</label><input name="amount" type="number" min="1" step="any" required value="${cust.currentDue || 0}" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Deposit To Account</label><select name="accountId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div><div><label class="block font-bold mb-1">Notes</label><input name="notes" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">Record Payment</button></form>`
            );
            m.querySelector('#col-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await collectCustomerPayment(cust.id, Number(fd.get('amount')), fd.get('accountId').toString(), fd.get('notes').toString());
              m.remove();
            };
          };
        });
        document.querySelectorAll('[data-ledger-cust]').forEach((b) => {
          b.onclick = () => {
            const cust = state.customers.find((x) => x.id === b.dataset.ledgerCust);
            const invs = state.sales.filter((s) => s.customerId === cust.id);
            openModal(
              `Customer Ledger — ${cust.name}`,
              `<table class="w-full text-xs text-left"><thead class="bg-slate-50"><tr><th class="p-2">Invoice</th><th class="p-2">Date</th><th class="p-2">Total</th><th class="p-2">Due</th></tr></thead><tbody>${invs.map((s) => `<tr class="border-t"><td class="p-2 font-bold">${esc(s.invoiceNumber)}</td><td class="p-2">${esc((s.createdAt || '').slice(0, 10))}</td><td class="p-2">${fmtMoney(s.total, state.currentBusiness.currency)}</td><td class="p-2 text-rose-600">${fmtMoney(s.dueAmount, state.currentBusiness.currency)}</td></tr>`).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-400">No invoices yet.</td></tr>'}</tbody></table>`,
              'max-w-xl'
            );
          };
        });

        // Suppliers
        const suSearch = document.getElementById('sup-search-input');
        if (suSearch) {
          suSearch.oninput = () => {
            const pos = suSearch.selectionStart;
            state.suppliersSearch = suSearch.value;
            render();
            const el = document.getElementById('sup-search-input');
            if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
          };
        }
        const suFilter = document.getElementById('sup-filter-select');
        if (suFilter) suFilter.onchange = () => { state.suppliersFilter = suFilter.value; render(); };
        const suSort = document.getElementById('sup-sort-select');
        if (suSort) suSort.onchange = () => { state.suppliersSort = suSort.value; render(); };
        const expSupCsv = document.getElementById('btn-export-suppliers-csv');
        if (expSupCsv) {
          expSupCsv.onclick = () => {
            const rows = [
              ['Supplier', 'Company', 'Phone', 'Email', 'Address', 'Opening Balance', 'Total Purchased', 'Total Paid', 'Current Due'],
              ...state.suppliers.map((s) => [s.name, s.company, s.phone, s.email, s.address, s.openingBalance || 0, s.totalPurchased || 0, s.totalPaid || 0, s.currentDue || 0]),
            ];
            const blob = new Blob([rows.map((r) => r.map((x) => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `dms-suppliers-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
          };
        }
        const addSup = document.getElementById('btn-add-supplier');
        if (addSup) addSup.onclick = () => openSupplierModal(null);
        document.querySelectorAll('[data-edit-sup]').forEach((b) => (b.onclick = () => openSupplierModal(state.suppliers.find((x) => x.id === b.dataset.editSup))));
        document.querySelectorAll('[data-pay-sup]').forEach((b) => {
          b.onclick = () => {
            const sup = state.suppliers.find((x) => x.id === b.dataset.paySup);
            if (sup) openPaySupplierModal(sup);
          };
        });
        document.querySelectorAll('[data-ledger-sup]').forEach((b) => {
          b.onclick = () => openSupplierLedgerModal(b.dataset.ledgerSup, 'statement');
        });
        document.querySelectorAll('[data-purchase-sup]').forEach((b) => {
          b.onclick = () => {
            state.currentView = 'purchases';
            state.purchasesTab = 'create';
            state.purchasesSupplierId = b.dataset.purchaseSup;
            render();
          };
        });

        // Accounts & Cashbook
        document.querySelectorAll('[data-acc-tab]').forEach((b) => (b.onclick = () => { state.accountsTab = b.dataset.accTab; render(); }));
        const cbSearch = document.getElementById('cb-search-input');
        if (cbSearch) cbSearch.oninput = () => { state.cashbookSearch = cbSearch.value; render(); };
        const cbFilter = document.getElementById('cb-dir-filter');
        if (cbFilter) cbFilter.onchange = () => { state.cashbookFilterType = cbFilter.value; render(); };
        const capBtn = document.getElementById('btn-record-capital');
        if (capBtn) capBtn.onclick = () => openCashbookEntryModal('CAPITAL_IN');
        const incBtn = document.getElementById('btn-record-other-income');
        if (incBtn) incBtn.onclick = () => openCashbookEntryModal('OTHER_INCOME');
        const drawBtn = document.getElementById('btn-record-drawing');
        if (drawBtn) drawBtn.onclick = () => openCashbookEntryModal('DRAWING_OUT');
        const addAcc = document.getElementById('btn-add-account');
        if (addAcc) {
          addAcc.onclick = () => {
            const m = openModal(
              'Add Cash / Bank / MFS Account',
              `<form id="acc-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">Account Name *</label><input name="name" required placeholder="e.g. Dutch Bangla Bank" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Type</label><select name="type" class="w-full px-3 py-2 rounded-xl border border-slate-300"><option value="cash">Cash</option><option value="bank">Bank</option><option value="mfs">MFS (bKash/Nagad)</option></select></div><div><label class="block font-bold mb-1">Account Number</label><input name="accountNumber" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Opening Balance</label><input name="balance" type="number" step="any" value="0" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">Create Account</button></form>`
            );
            m.querySelector('#acc-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await saveAccount({ name: fd.get('name').toString(), type: fd.get('type').toString(), accountNumber: fd.get('accountNumber').toString(), balance: Number(fd.get('balance') || 0) });
              m.remove();
            };
          };
        }
        const trBtn = document.getElementById('btn-transfer-funds');
        if (trBtn) {
          trBtn.onclick = () => {
            const m = openModal(
              'Transfer Between Accounts',
              `<form id="tr-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">From Account</label><select name="fromId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)} (${fmtMoney(a.balance, state.currentBusiness.currency)})</option>`).join('')}</select></div><div><label class="block font-bold mb-1">To Account</label><select name="toId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div><div><label class="block font-bold mb-1">Amount *</label><input name="amount" type="number" min="1" step="any" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Notes</label><input name="notes" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">Transfer Funds</button></form>`
            );
            m.querySelector('#tr-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              try {
                await transferFunds(fd.get('fromId').toString(), fd.get('toId').toString(), Number(fd.get('amount')), fd.get('notes').toString());
                m.remove();
              } catch (err) {
                showToast(err.message, 'error');
              }
            };
          };
        }

        // Expenses
        const eSearch = document.getElementById('exp-search-input');
        if (eSearch) eSearch.oninput = () => { state.expensesSearch = eSearch.value; render(); };
        const eCat = document.getElementById('exp-cat-filter');
        if (eCat) eCat.onchange = () => { state.expensesCategory = eCat.value; render(); };
        const addExp = document.getElementById('btn-add-expense');
        if (addExp) {
          addExp.onclick = () => {
            const m = openModal(
              'Record Business Expense',
              `<form id="exp-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">Expense Title *</label><input name="title" required placeholder="e.g. Shop Electricity Bill" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div class="grid grid-cols-2 gap-3"><div><label class="block font-bold mb-1">Category</label><select name="category" class="w-full px-3 py-2 rounded-xl border border-slate-300">${['Rent & Utilities', 'Staff Salary', 'Transport & Delivery', 'Marketing', 'Office Supplies', 'Maintenance', 'Other'].map((c) => `<option value="${c}">${c}</option>`).join('')}</select></div><div><label class="block font-bold mb-1">Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div></div><div class="grid grid-cols-2 gap-3"><div><label class="block font-bold mb-1">Amount *</label><input name="amount" type="number" min="1" step="any" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Pay From</label><select name="accountId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div></div><div><label class="block font-bold mb-1">Notes</label><input name="notes" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-rose-600 text-white font-bold">Record Expense</button></form>`
            );
            m.querySelector('#exp-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await saveExpense({ title: fd.get('title').toString(), category: fd.get('category').toString(), date: fd.get('date').toString(), amount: Number(fd.get('amount')), accountId: fd.get('accountId').toString(), notes: fd.get('notes').toString() });
              m.remove();
            };
          };
        }

        // Reports
        document.querySelectorAll('[data-rep-tab]').forEach((b) => (b.onclick = () => { state.reportsType = b.dataset.repTab; render(); }));
        const rTf = document.getElementById('rep-time-filter');
        if (rTf) rTf.onchange = () => { state.reportsTimeFilter = rTf.value; render(); };
        const csvBtn = document.getElementById('btn-export-csv');
        if (csvBtn) {
          csvBtn.onclick = () => {
            const d = getFilteredReportData();
            let rows = [];
            let name = state.reportsType.toLowerCase();
            if (state.reportsType === 'PL') {
              rows = [
                ['Line Item', 'Amount'],
                ['Gross Sales Revenue', d.grossSales],
                ['Less: Sales Returns', -d.saleReturnsAmt],
                ['Net Sales Revenue', d.netSales],
                ['Less: Net COGS', -d.netCogs],
                ['Gross Profit', d.grossProfit],
                ['Add: Other Income', d.otherIncome],
                ['Less: Operating Expenses', -d.totalExpenses],
                ['Net Profit / Loss', d.netProfit],
              ];
            } else if (state.reportsType === 'BS') {
              const totalAssets = d.m.cashBalance + d.m.bankBalance + d.m.mfsBalance + d.m.inventoryValue + d.m.totalReceivables;
              const totalLiab = d.m.totalPayables + d.m.loansPayable;
              rows = [
                ['Account', 'Amount'],
                ['Cash in Hand', d.m.cashBalance],
                ['Bank Accounts', d.m.bankBalance],
                ['MFS Balance', d.m.mfsBalance],
                ['Inventory Stock Value', d.m.inventoryValue],
                ['Accounts Receivable', d.m.totalReceivables],
                ['Total Assets', totalAssets],
                ['Supplier Payables', d.m.totalPayables],
                ['Loans Payable', d.m.loansPayable],
                ["Owner's Equity", totalAssets - totalLiab],
              ];
            } else if (state.reportsType === 'DAYBOOK') {
              rows = [['Date', 'Type', 'Direction', 'Account', 'Party', 'Reference', 'Notes', 'Amount'], ...d.cashbook.map((e) => [(e.date || e.createdAt || '').slice(0, 10), e.entryType, e.direction, e.accountName, e.partyName, e.referenceId, e.notes, e.amount])];
            } else if (state.reportsType === 'RETURNS') {
              rows = [['Return #', 'Type', 'Reference', 'Party', 'Total', 'Cash Refund', 'Due Adjusted', 'Reason', 'Date'], ...d.returns.map((r) => [r.returnNumber || r.id, r.type, r.referenceId, r.partyName, r.totalAmount || r.totalRefund, r.cashRefund, r.dueAdjusted, r.reason, (r.createdAt || '').slice(0, 10)])];
            } else if (state.reportsType === 'PURCHASES') {
              rows = [['Bill #', 'Date', 'Supplier', 'Total', 'Paid', 'Due', 'Status'], ...d.purchases.map((p) => [p.billNumber, (p.createdAt || '').slice(0, 10), p.supplierName, p.total, p.paidAmount, p.dueAmount, p.status])];
            } else if (state.reportsType === 'STOCK') {
              rows = [['Product', 'SKU', 'Stock', 'Unit', 'Cost', 'Value'], ...state.products.map((p) => [p.name, p.sku, p.currentStock, p.unit, p.purchasePrice, (p.currentStock || 0) * (p.purchasePrice || 0)])];
            } else if (state.reportsType === 'PAYABLES') {
              rows = [['Supplier', 'Phone', 'Total Purchased', 'Total Paid', 'Payable Due'], ...state.suppliers.map((s) => [s.name, s.phone, Number(s.totalPurchased || 0) + Number(s.openingBalance || 0), s.totalPaid || 0, s.currentDue || 0])];
            } else if (state.reportsType === 'DUES') {
              rows = [['Customer', 'Phone', 'Total Billed', 'Receivable Due'], ...state.customers.map((c) => [c.name, c.phone, c.totalPurchases, c.currentDue])];
            } else {
              rows = [['Invoice', 'Date', 'Customer', 'Total', 'Paid', 'Due', 'Status'], ...d.sales.map((s) => [s.invoiceNumber, (s.createdAt || '').slice(0, 10), s.customerName, s.total, s.paidAmount, s.dueAmount, s.status])];
            }
            const blob = new Blob([rows.map((r) => r.map((x) => `"${String(x ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `dms-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
          };
        }
        const pdfBtn = document.getElementById('btn-export-pdf');
        if (pdfBtn) {
          pdfBtn.onclick = () => exportFinancialReportPdf();
        }

        // Members
        const addMb = document.getElementById('btn-add-member');
        if (addMb) {
          addMb.onclick = () => {
            const m = openModal(
              'Add Staff Member',
              `<form id="mb-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">Staff User UID *</label><input name="uid" required placeholder="Firebase Auth UID" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Full Name *</label><input name="name" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Email *</label><input name="email" type="email" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Role</label><select name="role" class="w-full px-3 py-2 rounded-xl border border-slate-300"><option value="admin">Admin</option><option value="manager">Manager</option><option value="accountant">Accountant</option><option value="salesperson">Salesperson</option><option value="inventory_manager">Inventory Manager</option></select></div><button type="submit" class="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">Add Member</button></form>`
            );
            m.querySelector('#mb-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await saveMember(fd.get('uid').toString(), fd.get('name').toString(), fd.get('email').toString(), fd.get('role').toString());
              m.remove();
            };
          };
        }
        document.querySelectorAll('[data-del-member]').forEach((b) => {
          b.onclick = async () => {
            const mb = state.members.find((x) => x.id === b.dataset.delMember);
            if (mb && (await askConfirm('Remove Member?', `Remove "${mb.name}" from this workspace?`))) removeMember(mb);
          };
        });

        // Audit logs
        const aSearch = document.getElementById('audit-search-input');
        if (aSearch) aSearch.oninput = () => { state.auditSearch = aSearch.value; render(); };
        const aMod = document.getElementById('audit-mod-filter');
        if (aMod) aMod.onchange = () => { state.auditModule = aMod.value; render(); };

        // Settings
        const setLogoUrlInp = document.getElementById('settings-logo-url');
        const setLogoPreview = document.getElementById('settings-logo-preview');
        if (setLogoUrlInp && setLogoPreview) {
          setLogoUrlInp.oninput = () => {
            setLogoPreview.innerHTML = renderShopLogoHtml(
              { ...state.currentBusiness, logoUrl: setLogoUrlInp.value.trim() },
              'w-14 h-14',
              'text-base'
            );
          };
        }
        const rmLogoBtn = document.getElementById('btn-remove-settings-logo');
        if (rmLogoBtn) {
          rmLogoBtn.onclick = async () => {
            try {
              if (setLogoUrlInp) setLogoUrlInp.value = '';
              await updateBusinessProfile({ logoUrl: '' });
            } catch (err) {
              showToast('Could not remove logo: ' + (err?.message || 'Error'), 'error');
            }
          };
        }
        const setLogoFile = document.getElementById('settings-logo-file');
        if (setLogoFile) {
          setLogoFile.onchange = async (e) => {
            const f = e.target.files?.[0];
            if (!f) return;
            try {
              showToast('Uploading & saving shop logo...', 'info');
              const url = await uploadFileToStorage(f, `logos/${state.currentBusiness.id}/${Date.now()}_${f.name}`);
              if (setLogoUrlInp) setLogoUrlInp.value = url;
              if (setLogoPreview) {
                setLogoPreview.innerHTML = renderShopLogoHtml({ ...state.currentBusiness, logoUrl: url }, 'w-14 h-14', 'text-base');
              }
              await updateBusinessProfile({ logoUrl: url });
            } catch (err) {
              showToast('Failed to upload/save shop logo: ' + (err?.message || 'Try a smaller image'), 'error');
            }
          };
        }
        const setForm = document.getElementById('settings-form');
        if (setForm) {
          setForm.onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(setForm);
            try {
              await updateBusinessProfile({
                name: fd.get('name').toString().trim(),
                ownerName: fd.get('ownerName').toString().trim(),
                phone: fd.get('phone').toString().trim(),
                whatsapp: fd.get('whatsapp').toString().trim(),
                invoicePrefix: fd.get('invoicePrefix').toString().trim(),
                currency: fd.get('currency').toString(),
                address: fd.get('address').toString().trim(),
                logoUrl: fd.get('logoUrl').toString().trim(),
              });
            } catch (err) {
              showToast('Failed to save settings: ' + (err?.message || 'Error'), 'error');
            }
          };
        }
        const bkBtn = document.getElementById('btn-download-backup');
        if (bkBtn) {
          bkBtn.onclick = () => {
            const payload = {
              exportedAt: new Date().toISOString(),
              business: state.currentBusiness,
              products: state.products,
              customers: state.customers,
              suppliers: state.suppliers,
              sales: state.sales,
              purchases: state.purchases,
              accounts: state.accounts,
              expenses: state.expenses,
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `dms-backup-${state.currentBusiness.id}.json`;
            a.click();
          };
        }
      }

      // ================= BOOTSTRAP AUTH =================
      getRedirectResult(auth).catch((err) => {
        if (err && err.code) {
          state.authErrorCode = err.code;
          state.authError = formatAuthError(err);
          state.authLoading = false;
          render();
        }
      });

      onAuthStateChanged(auth, async (user) => {
        state.authLoadingSubmit = false;
        state.authError = null;
        state.authErrorCode = '';
        if (user) {
          state.user = user;
          state.authLoading = true;
          render();
          state.userProfile = await syncUserProfile(user, {
            displayName: state.pendingDisplayName || '',
            phone: state.pendingPhone || '',
            address: state.pendingAddress || '',
          });
          if (isSuperAdminUser(user)) {
            cleanupBusinessSubs();
            cleanupUserSubs();
            state.businesses = [];
            state.currentBusiness = null;
            subscribeAdminData();
          } else {
            cleanupAdminSubs();
            subscribeUserAccount(user.uid);
            await fetchBusinessesForUser(user, state.userProfile);
          }
          state.authLoading = false;
          render();
        } else {
          cleanupBusinessSubs();
          cleanupUserSubs();
          cleanupAdminSubs();
          state.user = null;
          state.userProfile = null;
          state.userRequests = [];
          state.adminUsers = [];
          state.adminBusinesses = [];
          state.adminRequests = [];
          state.adminError = '';
          state.businesses = [];
          selectBusiness(null);
          state.authLoading = false;
          render();
        }
      });
    </script>
  </body>
</html>
