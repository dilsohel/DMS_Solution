        if (dashSale) dashSale.onclick = openSaleEntryModal;
        const switcher = document.getElementById('nav-biz-switcher');
        if (switcher) {
          switcher.onchange = () => {
            const b = state.businesses.find((x) => x.id === switcher.value);
            if (b) { selectBusiness(b); render(); }
          };
        }
        const openNewBiz = () => {
          state.wizardStep = 1;
          state.wizardForm.name = '';
          const m = openModal('Create Another Business', renderWizardView(false).replace('min-h-screen bg-[#f8fbff] flex items-center justify-center p-4 sm:p-8', ''), 'max-w-2xl');
          bindWizardEvents(false, m);
        };
        const nb1 = document.getElementById('btn-nav-new-biz');
        if (nb1) nb1.onclick = openNewBiz;
        const nb2 = document.getElementById('btn-mobile-new-biz');
        if (nb2) nb2.onclick = () => { state.mobileSidebarOpen = false; openNewBiz(); };

        // FAB
        const fabBtn = document.getElementById('btn-toggle-fab');
        if (fabBtn) fabBtn.onclick = () => { state.fabOpen = !state.fabOpen; render(); };
        document.querySelectorAll('[data-fab]').forEach((b) => {
          b.onclick = () => {
            state.fabOpen = false;
            const act = b.dataset.fab;
            if (act === 'sale') openSaleEntryModal();
            else if (act === 'purchase') { state.currentView = 'purchases'; render(); }
            else if (act === 'expense') document.getElementById('btn-add-expense')?.click() || (state.currentView = 'expenses', render());
            else if (act === 'product') openProductModal(null);
            else if (act === 'support') openSupportModal();
          };
        });

        // Print sale/purchase
        document.querySelectorAll('[data-print-sale]').forEach((b) => {
          b.onclick = () => {
            const s = state.sales.find((x) => x.id === b.dataset.printSale);
            if (s) openInvoicePrintModal(s, 'SALE');
          };
        });
        document.querySelectorAll('[data-print-purchase]').forEach((b) => {
          b.onclick = () => {
            const p = state.purchases.find((x) => x.id === b.dataset.printPurchase);
            if (p) openInvoicePrintModal(p, 'PURCHASE');
          };
        });

        // Sales view events
        document.querySelectorAll('[data-sales-tab]').forEach((b) => (b.onclick = () => { state.salesTab = b.dataset.salesTab; render(); }));
        const sSearch = document.getElementById('sales-search-input');
        if (sSearch) sSearch.oninput = () => { state.salesSearch = sSearch.value; render(); };
        const sStat = document.getElementById('sales-status-filter');
        if (sStat) sStat.onchange = () => { state.salesStatusFilter = sStat.value; render(); };
        const sCust = document.getElementById('sales-customer-select');
        if (sCust) sCust.onchange = () => { state.salesCustomerId = sCust.value; };
        const sQProd = document.getElementById('btn-sales-quick-prod');
        if (sQProd) sQProd.onclick = () => openProductModal(null);
        const sQCust = document.getElementById('btn-sales-quick-cust');
        if (sQCust) sQCust.onclick = () => openCustomerModal(null, (id) => { state.salesCustomerId = id; render(); });

        document.querySelectorAll('[data-add-cart]').forEach((b) => {
          b.onclick = () => {
            const p = state.products.find((x) => x.id === b.dataset.addCart);
            if (!p) return;
            const ex = state.salesCart.find((i) => i.productId === p.id);
            if (ex) {
              if (ex.quantity < (p.currentStock || 0)) ex.quantity++;
            } else {
              state.salesCart.push({
                productId: p.id,
                productName: p.name,
                quantity: 1,
                unitPrice: Number(p.salePrice || 0),
                purchasePrice: Number(p.purchasePrice || 0),
                maxStock: Number(p.currentStock || 0),
              });
            }
            const sub = state.salesCart.reduce((s, it) => s + it.unitPrice * it.quantity, 0);
            state.salesPaid = Math.max(0, sub - Number(state.salesDiscount || 0));
            render();
          };
        });
        document.querySelectorAll('[data-cart-qty]').forEach((inp) => {
          inp.onchange = () => {
            const idx = Number(inp.dataset.cartQty);
            state.salesCart[idx].quantity = Math.max(1, Math.min(state.salesCart[idx].maxStock, Number(inp.value || 1)));
            render();
          };
        });
        document.querySelectorAll('[data-cart-price]').forEach((inp) => {
          inp.onchange = () => {
            const idx = Number(inp.dataset.cartPrice);
            state.salesCart[idx].unitPrice = Math.max(0, Number(inp.value || 0));
            render();
          };
        });
        document.querySelectorAll('[data-cart-remove]').forEach((b) => {
          b.onclick = () => { state.salesCart.splice(Number(b.dataset.cartRemove), 1); render(); };
        });
        const sDisc = document.getElementById('sales-discount-input');
        if (sDisc) sDisc.onchange = () => { state.salesDiscount = Number(sDisc.value || 0); render(); };
        const sTax = document.getElementById('sales-tax-input');
        if (sTax) sTax.onchange = () => { state.salesTaxPercent = Number(sTax.value || 0); render(); };
        const sPaid = document.getElementById('sales-paid-input');
        if (sPaid) sPaid.onchange = () => { state.salesPaid = Number(sPaid.value || 0); render(); };
        const sAcc = document.getElementById('sales-account-select');
        if (sAcc) sAcc.onchange = () => { state.salesAccountId = sAcc.value; };
        const compSale = document.getElementById('btn-complete-sale');
        if (compSale) {
          compSale.onclick = async () => {
            if (state.salesCart.length === 0) return showToast('Cart is empty.', 'error');
            compSale.disabled = true;
            compSale.textContent = 'Processing...';
            try {
              const cust = state.customers.find((x) => x.id === state.salesCustomerId);
              const sub = state.salesCart.reduce((s, it) => s + it.unitPrice * it.quantity, 0);
              const disc = Number(state.salesDiscount || 0);
              const taxAmt = Math.max(0, ((sub - disc) * Number(state.salesTaxPercent || 0)) / 100);
              const total = Math.max(0, sub - disc + taxAmt);
              const sale = await createSale({
                customerId: cust?.id || '',
                customerName: cust?.name || 'Walk-in Customer',
                customerPhone: cust?.phone || '',
                items: state.salesCart.map(({ maxStock, ...rest }) => rest),
                subtotal: sub,
                discount: disc,
                tax: taxAmt,
                total,
                paidAmount: Number(state.salesPaid || 0),
                paymentMethod: state.accounts.find((a) => a.id === state.salesAccountId)?.type || 'cash',
                accountId: state.salesAccountId,
              });
              state.salesCart = [];
              state.salesDiscount = 0;
              state.salesTaxPercent = 0;
              state.salesPaid = 0;
              showToast(`Sale ${sale.invoiceNumber} completed!`);
              render();
              openInvoicePrintModal(sale, 'SALE');
            } catch (err) {
              showToast(err.message || 'Sale error', 'error');
              compSale.disabled = false;
              compSale.textContent = 'Complete Sale & Print Invoice';
            }
          };
        }

        // Return sale/purchase
        document.querySelectorAll('[data-return-sale]').forEach((b) => {
          b.onclick = async () => {
            const s = state.sales.find((x) => x.id === b.dataset.returnSale);
            if (!s) return;
            const ok = await askConfirm('Process Sales Return?', `Return all items from ${s.invoiceNumber} back into stock and refund ${s.paidAmount}?`, 'Process Return');
            if (ok) {
              await createReturnRecord({
                type: 'SALE_RETURN',
                referenceId: s.invoiceNumber,
                partyId: s.customerId,
                partyName: s.customerName,
                items: s.items || [],
                totalRefund: s.paidAmount || s.total,
                accountId: s.accountId || state.accounts[0]?.id,
              });
            }
          };
        });
        document.querySelectorAll('[data-return-purchase]').forEach((b) => {
          b.onclick = async () => {
            const p = state.purchases.find((x) => x.id === b.dataset.returnPurchase);
            if (!p) return;
            const ok = await askConfirm('Process Purchase Return?', `Return items from ${p.billNumber} to supplier?`, 'Process Return');
            if (ok) {
              await createReturnRecord({
                type: 'PURCHASE_RETURN',
                referenceId: p.billNumber,
                partyId: p.supplierId,
                partyName: p.supplierName,
                items: p.items || [],
                totalRefund: p.paidAmount || p.total,
                accountId: p.accountId || state.accounts[0]?.id,
              });
            }
          };
        });

        // Purchases view events
        document.querySelectorAll('[data-pur-tab]').forEach((b) => (b.onclick = () => { state.purchasesTab = b.dataset.purTab; render(); }));
        const pSearch = document.getElementById('pur-search-input');
        if (pSearch) pSearch.oninput = () => { state.purchasesSearch = pSearch.value; render(); };
        const pSup = document.getElementById('pur-supplier-select');
        if (pSup) pSup.onchange = () => { state.purchasesSupplierId = pSup.value; };
        document.querySelectorAll('[data-add-pur]').forEach((b) => {
          b.onclick = () => {
            const p = state.products.find((x) => x.id === b.dataset.addPur);
            if (!p) return;
            const ex = state.purchasesCart.find((i) => i.productId === p.id);
            if (ex) ex.quantity++;
            else state.purchasesCart.push({ productId: p.id, productName: p.name, quantity: 1, unitCost: Number(p.purchasePrice || 0) });
            state.purchasesPaid = Math.max(0, state.purchasesCart.reduce((s, it) => s + it.unitCost * it.quantity, 0) - Number(state.purchasesDiscount || 0));
            render();
          };
        });
        document.querySelectorAll('[data-pur-qty]').forEach((inp) => (inp.onchange = () => { state.purchasesCart[Number(inp.dataset.purQty)].quantity = Math.max(1, Number(inp.value || 1)); render(); }));
        document.querySelectorAll('[data-pur-cost]').forEach((inp) => (inp.onchange = () => { state.purchasesCart[Number(inp.dataset.purCost)].unitCost = Math.max(0, Number(inp.value || 0)); render(); }));
        document.querySelectorAll('[data-pur-remove]').forEach((b) => (b.onclick = () => { state.purchasesCart.splice(Number(b.dataset.purRemove), 1); render(); }));
        const pDisc = document.getElementById('pur-discount-input');
        if (pDisc) pDisc.onchange = () => { state.purchasesDiscount = Number(pDisc.value || 0); render(); };
        const pPaid = document.getElementById('pur-paid-input');
        if (pPaid) pPaid.onchange = () => { state.purchasesPaid = Number(pPaid.value || 0); render(); };
        const pAcc = document.getElementById('pur-account-select');
        if (pAcc) pAcc.onchange = () => { state.purchasesAccountId = pAcc.value; };
        const compPur = document.getElementById('btn-complete-purchase');
        if (compPur) {
          compPur.onclick = async () => {
            if (state.purchasesCart.length === 0) return showToast('Select items first.', 'error');
            compPur.disabled = true;
            try {
              const sup = state.suppliers.find((x) => x.id === state.purchasesSupplierId);
              const sub = state.purchasesCart.reduce((s, it) => s + it.unitCost * it.quantity, 0);
              const total = Math.max(0, sub - Number(state.purchasesDiscount || 0));
              await createPurchase({
                supplierId: sup?.id || '',
                supplierName: sup?.name || 'Direct Supplier',
                items: state.purchasesCart,
                subtotal: sub,
                discount: Number(state.purchasesDiscount || 0),
                total,
                paidAmount: Number(state.purchasesPaid || 0),
                accountId: state.purchasesAccountId,
              });
              state.purchasesCart = [];
              state.purchasesDiscount = 0;
              state.purchasesPaid = 0;
              showToast('Purchase recorded & stock replenished!');
              render();
            } catch (err) {
              showToast(err.message || 'Purchase failed', 'error');
              compPur.disabled = false;
            }
          };
        }

        // Products view
        const prSearch = document.getElementById('prod-search-input');
        if (prSearch) prSearch.oninput = () => { state.productsSearch = prSearch.value; render(); };
        const prCat = document.getElementById('prod-cat-filter');
        if (prCat) prCat.onchange = () => { state.productsCategory = prCat.value; render(); };
        const prSt = document.getElementById('prod-stock-filter');
        if (prSt) prSt.onchange = () => { state.productsStockFilter = prSt.value; render(); };
        const addProd = document.getElementById('btn-add-product');
        if (addProd) addProd.onclick = () => openProductModal(null);
        const movBtn = document.getElementById('btn-view-movements');
        if (movBtn) {
          movBtn.onclick = () =>
            openModal(
              'Stock Movement Audit',
              `<table class="w-full text-xs text-left"><thead class="bg-slate-50"><tr><th class="p-2">Product</th><th class="p-2">Type</th><th class="p-2">Qty</th><th class="p-2">New Stock</th><th class="p-2">Ref</th></tr></thead><tbody>${state.stockMovements.slice(0, 60).map((m) => `<tr class="border-t"><td class="p-2 font-bold">${esc(m.productName)}</td><td class="p-2">${esc(m.type)}</td><td class="p-2">${m.quantity}</td><td class="p-2">${m.newStock}</td><td class="p-2">${esc(m.referenceId)}</td></tr>`).join('')}</tbody></table>`,
              'max-w-2xl'
            );
        }
        document.querySelectorAll('[data-edit-prod]').forEach((b) => (b.onclick = () => openProductModal(state.products.find((x) => x.id === b.dataset.editProd))));
        document.querySelectorAll('[data-del-prod]').forEach((b) => {
          b.onclick = async () => {
            const p = state.products.find((x) => x.id === b.dataset.delProd);
            if (p && (await askConfirm('Delete Product?', `Permanently delete "${p.name}"?`, 'Delete'))) removeProduct(p);
          };
        });
        document.querySelectorAll('[data-adjust-prod]').forEach((b) => {
          b.onclick = () => {
            const p = state.products.find((x) => x.id === b.dataset.adjustProd);
            if (!p) return;
            const m = openModal(
              `Adjust Stock — ${p.name}`,
              `<form id="adj-form" class="space-y-3 text-xs"><div>Current Stock: <strong>${p.currentStock}</strong></div><div><label class="block font-bold mb-1">Adjustment (+/- quantity)</label><input name="delta" type="number" required placeholder="e.g. 10 or -2" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Reason</label><input name="reason" required placeholder="e.g. Physical count / Damage" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-amber-600 text-white font-bold">Apply Stock Adjustment</button></form>`
            );
            m.querySelector('#adj-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await adjustProductStock(p.id, Number(fd.get('delta')), fd.get('reason').toString());
              m.remove();
            };
          };
        });

        // Customers
        const cSearch = document.getElementById('cust-search-input');
        if (cSearch) cSearch.oninput = () => { state.customersSearch = cSearch.value; render(); };
        const addCust = document.getElementById('btn-add-customer');
        if (addCust) addCust.onclick = () => openCustomerModal(null);
        document.querySelectorAll('[data-edit-cust]').forEach((b) => (b.onclick = () => openCustomerModal(state.customers.find((x) => x.id === b.dataset.editCust))));
        document.querySelectorAll('[data-collect-cust]').forEach((b) => {
          b.onclick = () => {
            const cust = state.customers.find((x) => x.id === b.dataset.collectCust);
            if (!cust) return;
            const m = openModal(
              `Collect Due — ${cust.name}`,
              `<form id="col-form" class="space-y-3 text-xs"><div>Current Due: <strong class="text-rose-600">${fmtMoney(cust.currentDue || 0, state.currentBusiness.currency)}</strong></div><div><label class="block font-bold mb-1">Amount Received *</label><input name="amount" type="number" min="1" step="any" required value="${cust.currentDue || 0}" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Deposit To Account</label><select name="accountId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div><div><label class="block font-bold mb-1">Notes</label><input name="notes" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold">Record Payment</button></form>`
            );
            m.querySelector('#col-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await collectCustomerPayment(cust.id, Number(fd.get('amount')), fd.get('accountId').toString(), fd.get('notes').toString());
              m.remove();
            };
          };
        });
        document.querySelectorAll('[data-ledger-cust]').forEach((b) => {
          b.onclick = () => {
            const cust = state.customers.find((x) => x.id === b.dataset.ledgerCust);
            const invs = state.sales.filter((s) => s.customerId === cust.id);
            openModal(
              `Customer Ledger — ${cust.name}`,
              `<table class="w-full text-xs text-left"><thead class="bg-slate-50"><tr><th class="p-2">Invoice</th><th class="p-2">Date</th><th class="p-2">Total</th><th class="p-2">Due</th></tr></thead><tbody>${invs.map((s) => `<tr class="border-t"><td class="p-2 font-bold">${esc(s.invoiceNumber)}</td><td class="p-2">${esc((s.createdAt || '').slice(0, 10))}</td><td class="p-2">${fmtMoney(s.total, state.currentBusiness.currency)}</td><td class="p-2 text-rose-600">${fmtMoney(s.dueAmount, state.currentBusiness.currency)}</td></tr>`).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-400">No invoices yet.</td></tr>'}</tbody></table>`,
              'max-w-xl'
            );
          };
        });

        // Suppliers
        const suSearch = document.getElementById('sup-search-input');
        if (suSearch) suSearch.oninput = () => { state.suppliersSearch = suSearch.value; render(); };
        const addSup = document.getElementById('btn-add-supplier');
        if (addSup) addSup.onclick = () => openSupplierModal(null);
        document.querySelectorAll('[data-edit-sup]').forEach((b) => (b.onclick = () => openSupplierModal(state.suppliers.find((x) => x.id === b.dataset.editSup))));
        document.querySelectorAll('[data-pay-sup]').forEach((b) => {
          b.onclick = () => {
            const sup = state.suppliers.find((x) => x.id === b.dataset.paySup);
            if (!sup) return;
            const m = openModal(
              `Pay Supplier — ${sup.name}`,
              `<form id="pay-sup-form" class="space-y-3 text-xs"><div>Payable Balance: <strong class="text-rose-600">${fmtMoney(sup.currentDue || 0, state.currentBusiness.currency)}</strong></div><div><label class="block font-bold mb-1">Amount Paid *</label><input name="amount" type="number" min="1" step="any" required value="${sup.currentDue || 0}" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Pay From Account</label><select name="accountId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div><button type="submit" class="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">Record Supplier Payment</button></form>`
            );
            m.querySelector('#pay-sup-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await paySupplier(sup.id, Number(fd.get('amount')), fd.get('accountId').toString());
              m.remove();
            };
          };
        });
        document.querySelectorAll('[data-ledger-sup]').forEach((b) => {
          b.onclick = () => {
            const sup = state.suppliers.find((x) => x.id === b.dataset.ledgerSup);
            const bills = state.purchases.filter((p) => p.supplierId === sup.id);
            openModal(
              `Supplier Ledger — ${sup.name}`,
              `<table class="w-full text-xs text-left"><thead class="bg-slate-50"><tr><th class="p-2">Bill</th><th class="p-2">Date</th><th class="p-2">Total</th><th class="p-2">Due</th></tr></thead><tbody>${bills.map((p) => `<tr class="border-t"><td class="p-2 font-bold">${esc(p.billNumber)}</td><td class="p-2">${esc((p.createdAt || '').slice(0, 10))}</td><td class="p-2">${fmtMoney(p.total, state.currentBusiness.currency)}</td><td class="p-2 text-rose-600">${fmtMoney(p.dueAmount, state.currentBusiness.currency)}</td></tr>`).join('') || '<tr><td colspan="4" class="p-4 text-center text-slate-400">No purchase bills yet.</td></tr>'}</tbody></table>`,
              'max-w-xl'
            );
          };
        });

        // Accounts
        const addAcc = document.getElementById('btn-add-account');
        if (addAcc) {
          addAcc.onclick = () => {
            const m = openModal(
              'Add Cash / Bank / MFS Account',
              `<form id="acc-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">Account Name *</label><input name="name" required placeholder="e.g. Dutch Bangla Bank" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Type</label><select name="type" class="w-full px-3 py-2 rounded-xl border border-slate-300"><option value="cash">Cash</option><option value="bank">Bank</option><option value="mfs">MFS (bKash/Nagad)</option></select></div><div><label class="block font-bold mb-1">Account Number</label><input name="accountNumber" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Opening Balance</label><input name="balance" type="number" step="any" value="0" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">Create Account</button></form>`
            );
            m.querySelector('#acc-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await saveAccount({ name: fd.get('name').toString(), type: fd.get('type').toString(), accountNumber: fd.get('accountNumber').toString(), balance: Number(fd.get('balance') || 0) });
              m.remove();
            };
          };
        }
        const trBtn = document.getElementById('btn-transfer-funds');
        if (trBtn) {
          trBtn.onclick = () => {
            const m = openModal(
              'Transfer Between Accounts',
              `<form id="tr-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">From Account</label><select name="fromId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)} (${fmtMoney(a.balance, state.currentBusiness.currency)})</option>`).join('')}</select></div><div><label class="block font-bold mb-1">To Account</label><select name="toId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div><div><label class="block font-bold mb-1">Amount *</label><input name="amount" type="number" min="1" step="any" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Notes</label><input name="notes" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">Transfer Funds</button></form>`
            );
            m.querySelector('#tr-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              try {
                await transferFunds(fd.get('fromId').toString(), fd.get('toId').toString(), Number(fd.get('amount')), fd.get('notes').toString());
                m.remove();
              } catch (err) {
                showToast(err.message, 'error');
              }
            };
          };
        }

        // Expenses
        const eSearch = document.getElementById('exp-search-input');
        if (eSearch) eSearch.oninput = () => { state.expensesSearch = eSearch.value; render(); };
        const eCat = document.getElementById('exp-cat-filter');
        if (eCat) eCat.onchange = () => { state.expensesCategory = eCat.value; render(); };
        const addExp = document.getElementById('btn-add-expense');
        if (addExp) {
          addExp.onclick = () => {
            const m = openModal(
              'Record Business Expense',
              `<form id="exp-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">Expense Title *</label><input name="title" required placeholder="e.g. Shop Electricity Bill" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div class="grid grid-cols-2 gap-3"><div><label class="block font-bold mb-1">Category</label><select name="category" class="w-full px-3 py-2 rounded-xl border border-slate-300">${['Rent & Utilities', 'Staff Salary', 'Transport & Delivery', 'Marketing', 'Office Supplies', 'Maintenance', 'Other'].map((c) => `<option value="${c}">${c}</option>`).join('')}</select></div><div><label class="block font-bold mb-1">Date</label><input name="date" type="date" value="${new Date().toISOString().slice(0, 10)}" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div></div><div class="grid grid-cols-2 gap-3"><div><label class="block font-bold mb-1">Amount *</label><input name="amount" type="number" min="1" step="any" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Pay From</label><select name="accountId" class="w-full px-3 py-2 rounded-xl border border-slate-300">${state.accounts.map((a) => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select></div></div><div><label class="block font-bold mb-1">Notes</label><input name="notes" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><button type="submit" class="w-full py-2.5 rounded-xl bg-rose-600 text-white font-bold">Record Expense</button></form>`
            );
            m.querySelector('#exp-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await saveExpense({ title: fd.get('title').toString(), category: fd.get('category').toString(), date: fd.get('date').toString(), amount: Number(fd.get('amount')), accountId: fd.get('accountId').toString(), notes: fd.get('notes').toString() });
              m.remove();
            };
          };
        }

        // Reports
        document.querySelectorAll('[data-rep-tab]').forEach((b) => (b.onclick = () => { state.reportsType = b.dataset.repTab; render(); }));
        const rTf = document.getElementById('rep-time-filter');
        if (rTf) rTf.onchange = () => { state.reportsTimeFilter = rTf.value; render(); };
        const csvBtn = document.getElementById('btn-export-csv');
        if (csvBtn) {
          csvBtn.onclick = () => {
            const rows = [['Invoice', 'Date', 'Customer', 'Total', 'Paid', 'Due', 'Status'], ...state.sales.map((s) => [s.invoiceNumber, (s.createdAt || '').slice(0, 10), s.customerName, s.total, s.paidAmount, s.dueAmount, s.status])];
            const blob = new Blob([rows.map((r) => r.map((x) => `"${String(x || '').replace(/"/g, '""')}"`).join(',')).join('\n')], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `dms-sales-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
          };
        }

        // Members
        const addMb = document.getElementById('btn-add-member');
        if (addMb) {
          addMb.onclick = () => {
            const m = openModal(
              'Add Staff Member',
              `<form id="mb-form" class="space-y-3 text-xs"><div><label class="block font-bold mb-1">Staff User UID *</label><input name="uid" required placeholder="Firebase Auth UID" class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Full Name *</label><input name="name" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Email *</label><input name="email" type="email" required class="w-full px-3 py-2 rounded-xl border border-slate-300" /></div><div><label class="block font-bold mb-1">Role</label><select name="role" class="w-full px-3 py-2 rounded-xl border border-slate-300"><option value="admin">Admin</option><option value="manager">Manager</option><option value="accountant">Accountant</option><option value="salesperson">Salesperson</option><option value="inventory_manager">Inventory Manager</option></select></div><button type="submit" class="w-full py-2.5 rounded-xl bg-sky-600 text-white font-bold">Add Member</button></form>`
            );
            m.querySelector('#mb-form').onsubmit = async (e) => {
              e.preventDefault();
              const fd = new FormData(e.target);
              await saveMember(fd.get('uid').toString(), fd.get('name').toString(), fd.get('email').toString(), fd.get('role').toString());
              m.remove();
            };
          };
        }
        document.querySelectorAll('[data-del-member]').forEach((b) => {
          b.onclick = async () => {
            const mb = state.members.find((x) => x.id === b.dataset.delMember);
            if (mb && (await askConfirm('Remove Member?', `Remove "${mb.name}" from this workspace?`))) removeMember(mb);
          };
        });

        // Audit logs
        const aSearch = document.getElementById('audit-search-input');
        if (aSearch) aSearch.oninput = () => { state.auditSearch = aSearch.value; render(); };
        const aMod = document.getElementById('audit-mod-filter');
        if (aMod) aMod.onchange = () => { state.auditModule = aMod.value; render(); };

        // Settings
        const setLogoFile = document.getElementById('settings-logo-file');
        if (setLogoFile) {
          setLogoFile.onchange = async (e) => {
            const f = e.target.files?.[0];
            if (f) {
              showToast('Uploading logo...', 'info');
              const url = await uploadFileToStorage(f, `logos/${state.currentBusiness.id}/${Date.now()}_${f.name}`);
              const urlInp = document.getElementById('settings-logo-url');
              if (urlInp) urlInp.value = url;
              showToast('Logo uploaded! Click Save Changes.');
            }
          };
        }
        const setForm = document.getElementById('settings-form');
        if (setForm) {
          setForm.onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(setForm);
            await updateBusinessProfile({
              name: fd.get('name').toString().trim(),
              ownerName: fd.get('ownerName').toString().trim(),
              phone: fd.get('phone').toString().trim(),
              whatsapp: fd.get('whatsapp').toString().trim(),
              invoicePrefix: fd.get('invoicePrefix').toString().trim(),
              currency: fd.get('currency').toString(),
              address: fd.get('address').toString().trim(),
              logoUrl: fd.get('logoUrl').toString().trim(),
            });
          };
        }
        const bkBtn = document.getElementById('btn-download-backup');
        if (bkBtn) {
          bkBtn.onclick = () => {
            const payload = {
              exportedAt: new Date().toISOString(),
              business: state.currentBusiness,
              products: state.products,
              customers: state.customers,
              suppliers: state.suppliers,
              sales: state.sales,
              purchases: state.purchases,
              accounts: state.accounts,
              expenses: state.expenses,
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `dms-backup-${state.currentBusiness.id}.json`;
            a.click();
          };
        }
      }

      // ================= BOOTSTRAP AUTH =================
      onAuthStateChanged(auth, async (user) => {
        state.authLoadingSubmit = false;
        state.authError = null;
        if (user) {
          state.user = user;
          state.authLoading = true;
          render();
          state.userProfile = await syncUserProfile(user);
          await fetchBusinessesForUser(user, state.userProfile);
          state.authLoading = false;
          render();
        } else {
          state.user = null;
          state.userProfile = null;
          state.businesses = [];
          selectBusiness(null);
          state.authLoading = false;
          render();
        }
      });
    </script>
  </body>
</html>
